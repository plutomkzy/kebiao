<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1020">
<title>组队大厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230f1020'/%3E%3Crect x='10' y='10' width='44' height='44' fill='%23ff4757'/%3E%3Crect x='20' y='20' width='10' height='10' fill='%23fff'/%3E%3Crect x='34' y='20' width='10' height='10' fill='%23fff'/%3E%3Crect x='20' y='36' width='24' height='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --dark:#0f1020; --dark2:#171a33; --line:#000;
  --red:#ff4757; --green:#2ed573; --blue:#1e90ff; --orange:#ffa502; --purple:#a55eea; --cyan:#22d3ee;
  --ink:#f2f2f7; --dim:#9aa0b5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--dark); color:var(--ink); padding-bottom:90px;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
    radial-gradient(80% 60% at 50% 0%, rgba(30,144,255,.18), transparent 70%);
  min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:14px 12px}
/* 像素通用件 */
.px{border:3px solid var(--line); box-shadow:0 4px 0 rgba(0,0,0,.55); background:var(--dark2)}
.px.flat{box-shadow:none}
.tab,.btn,.chip,button{font-family:inherit;cursor:pointer;border:3px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.6);
  background:#22254a;color:var(--ink);transition:transform .06s, box-shadow .06s}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn{display:inline-block;padding:9px 14px;font-size:15px;font-weight:700;text-decoration:none}
.btn.red{background:var(--red);color:#1b0008}
.btn.green{background:var(--green);color:#00210f}
.btn.blue{background:var(--blue);color:#001028}
.btn.orange{background:var(--orange);color:#231300}
.btn.purple{background:var(--purple);color:#180029}
.btn.ghost{background:#1b1e3a}
.btn.sm{padding:6px 10px;font-size:13.5px}
.btn.block{display:block;width:100%;text-align:center}
h1{font-size:22px;letter-spacing:2px}
h2{font-size:17px;letter-spacing:1px;margin-bottom:8px}
.mut{color:var(--dim);font-size:13.5px;line-height:1.6}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:44px;height:44px;background:var(--red);border:3px solid #000;box-shadow:0 4px 0 rgba(0,0,0,.55);
  display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff}
.badge{display:inline-block;padding:3px 9px;font-size:12.5px;font-weight:700;border:2px solid #000;background:var(--blue);color:#001028}
.badge.leader{background:var(--orange);color:#231300}
.badge.none{background:#3a3f63;color:#cfd6ff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.tab{flex:0 0 auto;padding:8px 14px;font-size:14.5px;font-weight:700;background:#1b1e3a}
.tab.on{background:var(--cyan);color:#00212b}
.card{padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.mem{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;margin:3px 4px 0 0;font-size:13.5px;
  background:#1b1e3a;border:2px solid #000}
.mem.leader{background:var(--orange);color:#231300;font-weight:700}
.icon{width:38px;height:38px;display:grid;place-items:center;font-size:19px;font-weight:900;
  border:3px solid #000;background:var(--purple);color:#fff}
.team{display:flex;gap:10px;align-items:flex-start;padding:11px;margin-bottom:10px}
.team.full{opacity:.62}
input[type=text],input[type=password],select,textarea{
  width:100%;font-family:inherit;font-size:15.5px;padding:9px;background:#0c0e1e;color:var(--ink);
  border:3px solid #000;box-shadow:inset 0 3px 0 rgba(0,0,0,.5);outline:none}
input:focus,select:focus{border-color:var(--cyan)}
label{font-size:13.5px;color:var(--dim);display:block;margin:8px 0 4px}
.invite{border:3px solid #000;background:linear-gradient(180deg,#2a1e4a,#1d1636);
  box-shadow:0 4px 0 rgba(0,0,0,.6);padding:12px;margin-bottom:10px}
.hr{height:3px;background:#000;opacity:.5;margin:10px 0}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{width:40px;height:40px;font-size:18px;background:#22254a}
.icons button.on{background:var(--cyan);color:#00212b}
details{margin-bottom:12px}
summary{cursor:pointer;font-weight:700;font-size:15px;padding:6px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;
  background:var(--green);color:#00210f;font-weight:800;padding:11px 18px;border:3px solid #000;
  box-shadow:0 4px 0 rgba(0,0,0,.6);max-width:90%;text-align:center}
.toast.err{background:var(--red);color:#1b0008}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px;background:var(--dark2);border-top:3px solid #000;
  display:flex;gap:8px;justify-content:center}
.foot .btn{flex:1;text-align:center}
.empty{padding:16px;text-align:center;color:var(--dim);border:3px dashed #33385c}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">队</div>
    <div class="grow">
      <h1>组队大厅</h1>
      <div class="mut" id="who">加载中…</div>
    </div>
    <button class="btn sm ghost" id="refresh">刷新</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="inbox"></div>
  <div id="mine"></div>
  <div id="hall"></div>

  <details id="social">
    <summary>搭档与黑名单</summary>
    <div class="px card" id="socialBox"></div>
  </details>

  <details id="adm">
    <summary>管理员后台（口令）</summary>
    <div class="px card">
      <div class="row">
        <input type="password" id="admpw" placeholder="管理员口令" class="grow">
        <button class="btn red" id="admgologin">进入</button>
      </div>
      <div id="admBox"></div>
    </div>
  </details>
</div>

<div class="foot">
  <a class="btn ghost" href="index.html">返回入口</a>
  <button class="btn blue" id="reload2">重新载入</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
const CLS = sessionStorage.getItem('cls');
const CODE = sessionStorage.getItem('code');
const PWD = sessionStorage.getItem('spwd');
const SNAME = sessionStorage.getItem('sname') || '';
if (!CLS || !CODE || !PWD || sessionStorage.getItem('app') !== 'team') location.href = 'student.html';

const ICONS = ['盾', '剑', '星', '火', '雷', '风', '花', '月', '虎', '龙', '鲸', '熊'];
let ST = null;          // team_state 结果
let CUR_TASK = null;    // 当前任务 id
let ADM = null;         // 管理员状态
let ADMPW = sessionStorage.getItem('admpw') || '';
let timer = null;

function toast(msg, err) {
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}
function esc2(s) { return esc(String(s == null ? '' : s)); }

async function call(fn, body) {
  const j = await rpc(fn, body);
  if (!j || typeof j !== 'object') return { ok: false, msg: '网络异常' };
  return j;
}
function me() { return { p_cls: CLS, p_code: CODE, p_pwd: PWD }; }
function payload(o) { return Object.assign({}, me(), o); }

/* ---------------- 载入状态 ---------------- */
async function load(keepScroll) {
  const y = window.scrollY;
  const j = await call('team_state', me());
  if (!j.ok) {
    $('#hall').innerHTML = '<div class="px card"><div class="mut">' + esc2(j.msg || '读取失败') +
      '<br>如果是提示函数不存在，请先在 Supabase 里运行《组队系统补丁.sql》。</div></div>';
    return;
  }
  ST = j;
  if (!CUR_TASK && ST.tasks.length) CUR_TASK = ST.tasks[0].id;
  render();
  if (keepScroll) window.scrollTo(0, y);
  if (ADMPW) loadAdmin(true);
}

function inGroup(taskId) { return (ST.my_groups || []).find(g => g.task_id === taskId); }
function isLeaderAnywhere() { return !!ST.is_leader; }
function isLeaderOf(taskId) {
  const g = inGroup(taskId);
  return !!(g && g.role === 'leader');
}
function ungroupedOf(taskId) { return (ST.ungrouped || []).filter(u => u.task_id === taskId); }
function teamsOf(taskId) { return (ST.teams || []).filter(t => t.task_id === taskId); }

function render() {
  const meRow = ST.me;
  $('#who').innerHTML = '<b>' + esc2(meRow.name) + '</b>（' + esc2(meRow.code) + '） ' +
    (isLeaderAnywhere() ? '<span class="badge leader">组长</span>' : '<span class="badge none">队员</span>');

  // 任务标签
  $('#tabs').innerHTML = ST.tasks.map(t => {
    const g = inGroup(t.id);
    const done = t.status === 'done';
    return '<button class="tab' + (t.id === CUR_TASK ? ' on' : '') + '" data-task="' + t.id + '">' +
      esc2(t.title) + (g ? ' ✓' : '') + (done ? '（已结束）' : '') + '</button>';
  }).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { CUR_TASK = b.dataset.task; render(); });

  renderInbox();
  renderMine();
  renderHall();
  renderSocial();
}

function renderInbox() {
  const list = ST.invites || [];
  if (!list.length) { $('#inbox').innerHTML = ''; return; }
  $('#inbox').innerHTML = list.map(v => (
    '<div class="invite">' +
    '<div class="row"><div class="icon">' + esc2(v.icon || '盾') + '</div><div class="grow">' +
    '<b>' + esc2(v.team_name) + '</b> <span class="mut">邀请你加入</span>' +
    '<div class="mut">来自 ' + esc2(v.from_name) + (v.slogan ? ' · 口号：' + esc2(v.slogan) : '') + '</div></div></div>' +
    '<div class="row" style="margin-top:9px">' +
    '<button class="btn green" data-acc="' + v.id + '">同意加入</button>' +
    '<button class="btn ghost" data-rej="' + v.id + '">拒绝</button>' +
    '<button class="btn red" data-blk="' + v.from_code + '">拉黑他</button>' +
    '</div></div>'
  )).join('');
  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => {
    const j = await call('team_respond', payload({ p_invite: b.dataset.acc, p_accept: true }));
    toast(j.msg || '', !j.ok); load(true);
  });
  document.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => {
    const j = await call('team_respond', payload({ p_invite: b.dataset.rej, p_accept: false }));
    toast(j.msg || '', !j.ok); load(true);
  });
  document.querySelectorAll('[data-blk]').forEach(b => b.onclick = async () => {
    if (!confirm('拉黑后对方不能再邀请你，确定吗？')) return;
    const j = await call('team_block', payload({ p_target: b.dataset.blk, p_block: true }));
    toast(j.msg || '', !j.ok); load(true);
  });
}

function renderMine() {
  const t = ST.tasks.find(x => x.id === CUR_TASK);
  if (!t) { $('#mine').innerHTML = '<div class="empty">没有分组任务</div>'; return; }
  const g = inGroup(CUR_TASK);
  const team = g ? teamsOf(CUR_TASK).find(x => x.id === g.team_id) : null;
  let html = '';

  if (team) {
    const leader = (team.members || []).find(m => m.role === 'leader');
    html += '<div class="px card"><h2>我的小组 · ' + esc2(team.name) + '</h2>' +
      '<div class="mut">' + (team.slogan ? '口号：' + esc2(team.slogan) + ' · ' : '') +
      '组长：' + esc2(leader ? leader.name : '—') + ' · 人数 ' + team.member_count + '/' + team.capacity + '</div>' +
      '<div style="margin-top:8px">' + (team.members || []).map(m =>
        '<span class="mem' + (m.role === 'leader' ? ' leader' : '') + '">' + esc2(m.name) +
        (m.role === 'leader' ? ' 组长' : '') + '</span>').join('') + '</div>';
    if (g.role === 'leader') {
      const rest = team.capacity - team.member_count;
      html += '<div class="hr"></div><div class="mut">本组还差 ' + rest + ' 人，去下面的"未分组名单"点邀请。</div>';
      if (team.member_count > 1) {
        html += '<label>申请踢出（需管理员批准）</label><div class="row">' +
          '<select id="kickSel" class="grow">' + (team.members || []).filter(m => m.role !== 'leader')
            .map(m => '<option value="' + m.code + '">' + esc2(m.name) + '</option>').join('') + '</select>' +
          '<button class="btn red sm" id="kickBtn">提交申请</button></div>';
      }
    } else {
      html += '<div class="hr"></div><button class="btn ghost block" id="leaveBtn">申请退组（需组长同意）</button>';
    }
    html += '</div>';
  } else {
    // 不在组里：已批准 → 建组；未批准 → 申请当组长
    const canCreate = (ST.leader_tasks || []).indexOf(CUR_TASK) >= 0;
    const pending = (ST.my_requests || []).some(r => r.kind === 'leader_apply' && r.task_id === CUR_TASK && r.status === 'pending');
    html += '<div class="px card"><h2>' + esc2(t.title) + '</h2>' +
      '<div class="mut">你还没有小组。' + (canCreate ? '你已是本任务认可的组长，可以建组招人。'
        : '可以申请当组长，批准后自己建组招人。') + '</div>';
    if (canCreate) {
      html += '<div class="hr"></div><label>小组名称</label><input type="text" id="tName" placeholder="例如：第七组 / 夜行者">' +
        '<label>口号（选填）</label><input type="text" id="tSlogan" placeholder="例如：不卷不躺，稳过期末">' +
        '<label>选个图标</label><div class="icons" id="iconPick">' +
        ICONS.map((ic, i) => '<button data-ic="' + ic + '"' + (i === 0 ? ' class="on"' : '') + '>' + ic + '</button>').join('') +
        '</div><div style="margin-top:10px"><button class="btn green block" id="createBtn">建组</button></div>';
    } else if (pending) {
      html += '<div class="mut" style="margin-top:8px">已提交组长申请，等待管理员审批。</div>';
    } else {
      html += '<div style="margin-top:10px"><button class="btn orange block" id="applyBtn">申请当组长</button></div>';
    }
    html += '</div>';
  }
  $('#mine').innerHTML = html;

  // 事件
  const leaveBtn = $('#leaveBtn');
  if (leaveBtn) leaveBtn.onclick = async () => {
    if (!confirm('确定申请退组？需要组长同意。')) return;
    const j = await call('team_request', payload({ p_kind: 'leave', p_task: CUR_TASK, p_target: null, p_note: '' }));
    toast(j.msg || '', !j.ok); load(true);
  };
  const kickBtn = $('#kickBtn');
  if (kickBtn) kickBtn.onclick = async () => {
    const code = $('#kickSel').value;
    if (!confirm('确定申请把该成员踢出？需管理员批准。')) return;
    const j = await call('team_request', payload({ p_kind: 'kick', p_task: CUR_TASK, p_target: code, p_note: '' }));
    toast(j.msg || '', !j.ok); load(true);
  };
  const applyBtn = $('#applyBtn');
  if (applyBtn) applyBtn.onclick = async () => {
    const j = await call('team_apply_leader', payload({ p_task: CUR_TASK, p_note: '' }));
    toast(j.msg || '', !j.ok); load(true);
  };
  const createBtn = $('#createBtn');
  if (createBtn) createBtn.onclick = async () => {
    let icon = '盾';
    const on = document.querySelector('#iconPick button.on');
    if (on) icon = on.dataset.ic;
    const name = $('#tName').value.trim();
    if (!name) { toast('请填写小组名称', true); return; }
    const j = await call('team_create', payload({
      p_task: CUR_TASK, p_name: name, p_slogan: $('#tSlogan').value.trim(), p_icon: icon }));
    toast(j.msg || '', !j.ok); load(true);
  };
  document.querySelectorAll('#iconPick button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#iconPick button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
}

function renderHall() {
  const t = ST.tasks.find(x => x.id === CUR_TASK);
  const teams = teamsOf(CUR_TASK);
  const leader = isLeaderOf(CUR_TASK);
  let html = '<div class="px card"><h2>大厅 · ' + esc2(t ? t.title : '') + '</h2>' +
    '<div class="mut">' + (t ? '每组 ' + t.size + ' 人' + (t.size_note ? '（' + esc2(t.size_note) + '）' : '') : '') +
    ' · 已有 ' + teams.length + ' 组 · 还差 ' +
    (t ? Math.max(0, (t.total || 0) - (t.joined || 0)) : 0) + ' 人未入组</div>';

  if (!teams.length) html += '<div class="empty" style="margin-top:10px">还没有小组，等组长建组</div>';
  else html += '<div style="margin-top:10px">' + teams.map(g => {
    const full = g.member_count >= g.capacity;
    if (CUR_TASK !== g.task_id) return '';
    return '<div class="px team' + (full ? ' full' : '') + '">' +
      '<div class="icon">' + esc2(g.icon || '盾') + '</div>' +
      '<div class="grow"><b>' + esc2(g.name) + '</b> ' + (full ? '<span class="badge none">已满</span>' : '') +
      '<div class="mut">组长 ' + esc2(g.leader_name || '—') + ' · ' + g.member_count + '/' + g.capacity +
      (g.slogan ? ' · ' + esc2(g.slogan) : '') + '</div>' +
      '<div style="margin-top:4px">' + (g.members || []).map(m =>
        '<span class="mem' + (m.role === 'leader' ? ' leader' : '') + '">' + esc2(m.name) + '</span>').join('') +
      '</div></div></div>';
  }).join('') + '</div>';
  html += '</div>';

  // 未分组名单（仅组长可见）
  if (leader) {
    const un = ungroupedOf(CUR_TASK).filter(u => u.code !== CODE);
    html += '<div class="px card"><h2>未分组名单（只有组长能看到）</h2>' +
      (un.length ? '<div class="row">' + un.map(u =>
        '<button class="btn blue sm" data-inv="' + u.code + '">邀请 ' + esc2(u.name) + '</button>').join('') + '</div>'
        : '<div class="mut">这个任务的人都已入组</div>') + '</div>';
  }
  $('#hall').innerHTML = html;
  document.querySelectorAll('[data-inv]').forEach(b => b.onclick = async () => {
    const j = await call('team_invite', payload({ p_task: CUR_TASK, p_to: b.dataset.inv }));
    toast(j.msg || '', !j.ok); load(true);
  });
}

function renderSocial() {
  const b = ST.binding;
  const blocks = ST.blocks || [];
  let html = '<h2>搭档绑定</h2>';
  if (!b) {
    html += '<div class="mut">还没有搭档。输入对方学号发出绑定邀请，对方同意后生效（与分组无关，长期有效）。</div>' +
      '<div class="row" style="margin-top:8px"><input type="text" id="bindCode" placeholder="对方学号" class="grow">' +
      '<button class="btn purple" id="bindBtn">发出邀请</button></div>';
  } else if (b.status === 'pending') {
    const mineReq = b.requested_by === CODE;
    html += '<div class="mut">与 <b>' + esc2(b.other_name) + '</b> 的绑定邀请：' +
      (mineReq ? '等待对方确认' : '对方邀请你绑定') + '</div>';
    if (!mineReq) {
      html += '<div class="row" style="margin-top:8px"><button class="btn green" id="bindAcc">同意</button>' +
        '<button class="btn ghost" id="bindRej">拒绝</button></div>';
    }
  } else {
    html += '<div class="mut">搭档：<b>' + esc2(b.other_name) + '</b>（已绑定）</div>';
  }
  html += '<div class="hr"></div><h2>黑名单</h2>' +
    (blocks.length ? '<div class="row">' + blocks.map(x =>
      '<button class="btn ghost sm" data-unblk="' + x.code + '">解除 ' + esc2(x.name) + '</button>').join('') + '</div>'
      : '<div class="mut">还没有拉黑任何人</div>');
  $('#socialBox').innerHTML = html;

  const bb = $('#bindBtn');
  if (bb) bb.onclick = async () => {
    const to = $('#bindCode').value.trim();
    if (!to) { toast('请输入对方学号', true); return; }
    const j = await call('binding_request', payload({ p_to: to }));
    toast(j.msg || '', !j.ok); load(true);
  };
  const ba = $('#bindAcc');
  if (ba) ba.onclick = async () => {
    const j = await call('binding_respond', payload({ p_id: b.id, p_accept: true }));
    toast(j.msg || '', !j.ok); load(true);
  };
  const br = $('#bindRej');
  if (br) br.onclick = async () => {
    const j = await call('binding_respond', payload({ p_id: b.id, p_accept: false }));
    toast(j.msg || '', !j.ok); load(true);
  };
  document.querySelectorAll('[data-unblk]').forEach(x => x.onclick = async () => {
    const j = await call('team_block', payload({ p_target: x.dataset.unblk, p_block: false }));
    toast(j.msg || '', !j.ok); load(true);
  });
}

/* ---------------- 管理员 ---------------- */
async function loadAdmin(silent) {
  if (!ADMPW) return;
  const j = await call('team_admin_state', { p_password: ADMPW });
  if (!j.ok) {
    if (!silent) { toast(j.msg || '口令错误', true); sessionStorage.removeItem('admpw'); ADMPW = ''; }
    return;
  }
  ADM = j;
  renderAdmin();
}

function renderAdmin() {
  if (!ADM) return;
  const reqs = ADM.requests || [];
  let html = '<div class="hr"></div><h2>待审批（' + reqs.length + '）</h2>';
  if (!reqs.length) html += '<div class="mut">没有待处理的申请</div>';
  else html += reqs.map(q => {
    const kindTxt = q.kind === 'leader_apply' ? '申请当组长' : q.kind === 'kick' ? '申请踢人' : '申请退组';
    const who = q.kind === 'kick' ? (esc2(q.from_name) + ' 申请踢出 ' + esc2(q.target_name)) : esc2(q.from_name);
    return '<div class="px card flat" style="margin-bottom:8px"><div class="row">' +
      '<div class="grow"><b>' + kindTxt + '</b> · ' + esc2(q.task_id || '') + '<div class="mut">' + who + '</div></div>' +
      '<button class="btn green sm" data-ap="' + q.id + '">批准</button>' +
      '<button class="btn ghost sm" data-rj="' + q.id + '">驳回</button></div></div>';
  }).join('');

  // 指派组长
  html += '<div class="hr"></div><h2>指派组长</h2><div class="row">' +
    '<select id="aTask" class="grow">' + (ADM.tasks || []).map(t =>
      '<option value="' + t.id + '">' + esc2(t.title) + '</option>').join('') + '</select>' +
    '<input type="text" id="aCode" placeholder="学号" style="max-width:130px">' +
    '<button class="btn orange sm" id="aMake">指派</button></div>';

  // 调组
  html += '<div class="hr"></div><h2>调组（原组留空）</h2>';
  (ADM.tasks || []).forEach(t => {
    const ts = (ADM.teams || []).filter(x => x.task_id === t.id);
    if (!ts.length) return;
    html += '<details><summary>' + esc2(t.title) + '（' + ts.length + ' 组）</summary>';
    ts.forEach(g => {
      html += '<div class="px card flat" style="margin:6px 0"><b>' + esc2(g.name) + '</b>' +
        '<span class="mut"> ' + (g.members || []).length + '/' + g.capacity + '</span>' +
        '<div style="margin-top:6px">' + (g.members || []).map(m =>
          '<span class="mem' + (m.role === 'leader' ? ' leader' : '') + '">' + esc2(m.name) + '</span>').join('') + '</div>' +
        '<div class="row" style="margin-top:6px">' +
        '<select class="grow" data-mvcode="' + esc2(g.id) + '">' +
        (g.members || []).map(m => '<option value="' + m.code + '">' + esc2(m.name) + '</option>').join('') +
        '</select><select style="max-width:150px" data-mvto="' + esc2(g.id) + '">' +
        ts.filter(x => x.id !== g.id).map(x => '<option value="' + x.id + '">→ ' + esc2(x.name) + '</option>').join('') +
        '</select><button class="btn blue sm" data-mv="' + esc2(g.id) + '|' + esc2(t.id) + '">移动</button></div></div>';
    });
    html += '</details>';
  });

  // 未分组（全部任务）
  const un = ADM.ungrouped || [];
  html += '<div class="hr"></div><h2>未分组总览（' + un.length + '）</h2>' +
    (un.length ? '<div class="mut">' + un.map(u => esc2(u.task_title) + '：' + esc2(u.name)).join('　') + '</div>'
      : '<div class="mut">所有任务都已分好</div>');

  $('#admBox').innerHTML = html;

  document.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
    const j = await call('team_admin_decide', { p_password: ADMPW, p_request: b.dataset.ap, p_approve: true });
    toast(j.msg || '', !j.ok); load(true);
  });
  document.querySelectorAll('[data-rj]').forEach(b => b.onclick = async () => {
    const j = await call('team_admin_decide', { p_password: ADMPW, p_request: b.dataset.rj, p_approve: false });
    toast(j.msg || '', !j.ok); load(true);
  });
  const mk = $('#aMake');
  if (mk) mk.onclick = async () => {
    const j = await call('team_admin_make_leader', {
      p_password: ADMPW, p_task: $('#aTask').value, p_code: $('#aCode').value.trim() });
    toast(j.msg || '', !j.ok); load(true);
  };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => {
    const [fromTeam, task] = b.dataset.mv.split('|');
    const code = document.querySelector('[data-mvcode="' + fromTeam + '"]').value;
    const to = document.querySelector('[data-mvto="' + fromTeam + '"]').value;
    if (!to) { toast('没有可调入的小组', true); return; }
    const j = await call('team_admin_move', { p_password: ADMPW, p_task: task, p_code: code, p_team: to });
    toast(j.msg || '', !j.ok); load(true);
  });
}

/* ---------------- 事件绑定 ---------------- */
$('#refresh').onclick = () => load(true);
$('#reload2').onclick = () => load(true);
$('#admgologin').onclick = () => {
  ADMPW = $('#admpw').value.trim();
  if (!ADMPW) { toast('请输入管理员口令', true); return; }
  sessionStorage.setItem('admpw', ADMPW);
  loadAdmin(false);
};
if (ADMPW) $('#admpw').value = ADMPW;

load();
timer = setInterval(() => load(true), 5000);   // 每 5 秒自动刷新大厅
</script>
</body>
</html>
