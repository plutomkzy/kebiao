<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d1c">
<title>组队大厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230b0d1c'/%3E%3Crect x='1' y='2' width='2' height='2' fill='%23ffd7a8'/%3E%3Crect x='5' y='2' width='2' height='2' fill='%23ffd7a8'/%3E%3Crect x='2' y='5' width='4' height='1' fill='%23ff4757'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0d1c; --bg2:#141733; --bg3:#1d2148;
  --line:#05060f; --ink:#f4f4ff; --dim:#9aa2c8;
  --red:#ff4d5e; --green:#3ddc84; --blue:#3d9bff; --orange:#ffb02e; --purple:#b06bff; --cyan:#2fe6e6;
  --gold:#ffd23f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"SimSun","宋体","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); padding:0 0 92px; min-height:100vh;
  image-rendering:pixelated;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px);
}
.wrap{max-width:820px;margin:0 auto;padding:12px 10px}
svg{display:block}
/* ===== 像素组件 ===== */
.pk{
  border:3px solid var(--line); background:var(--bg2);
  box-shadow:0 4px 0 var(--line), inset 0 3px 0 rgba(255,255,255,.05);
}
.pk.inset{box-shadow:inset 0 4px 0 rgba(0,0,0,.5)}
button,.btn{font-family:inherit;cursor:pointer;border:3px solid var(--line);background:var(--bg3);color:var(--ink);
  box-shadow:0 4px 0 var(--line);padding:9px 13px;font-size:15px;font-weight:700;
  transition:transform .05s steps(1), box-shadow .05s steps(1); letter-spacing:1px}
button:active,.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.btn{display:inline-block;text-decoration:none;text-align:center}
.b-red{background:var(--red);color:#2a0006}.b-green{background:var(--green);color:#00301a}
.b-blue{background:var(--blue);color:#001733}.b-orange{background:var(--orange);color:#2a1600}
.b-purple{background:var(--purple);color:#1c0033}.b-cyan{background:var(--cyan);color:#00292b}
.b-ghost{background:#20244d}
.sm{padding:6px 9px;font-size:13.5px}
.block{display:block;width:100%}
.mut{color:var(--dim);font-size:13.5px;line-height:1.65}
h1{font-size:19px;letter-spacing:2px}
h2{font-size:16px;letter-spacing:1px;margin-bottom:8px;color:#fff}
h2::before{content:"■ ";color:var(--gold)}
.sec{padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
body{overflow-x:hidden}
input,select{max-width:100%}
/* ===== 玩家 HUD ===== */
.hud{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:12px}
.plate{display:flex;gap:9px;align-items:center;flex:1;min-width:0}
.pname{font-size:17px;font-weight:800;letter-spacing:1px}
.tagline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.tag{font-size:12px;padding:2px 7px;border:2px solid var(--line);background:var(--blue);color:#001733;font-weight:700}
.tag.leader{background:var(--orange);color:#2a1600}
.tag.lv{background:var(--purple);color:#1c0033}
.slotdot{display:inline-block;width:11px;height:11px;border:2px solid var(--line);background:#111533;margin-right:3px}
.slotdot.on{background:var(--gold)}
/* ===== 任务标签 ===== */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.tab{flex:0 0 auto;font-size:14.5px;background:#191d3d}
.tab.on{background:var(--cyan);color:#00292b;box-shadow:0 4px 0 var(--line), 0 0 0 3px rgba(47,230,230,.25)}
/* ===== 邀请（急件） ===== */
.mail{position:relative;padding:12px;margin-bottom:10px;background:linear-gradient(180deg,#2a1f52,#1a1638)}
.mail .new{position:absolute;right:-6px;top:-10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;
  padding:2px 7px;border:2px solid var(--line);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
/* ===== 队伍卡 ===== */
.crest{width:60px;height:60px;flex:0 0 auto;border:3px solid var(--line);box-shadow:0 3px 0 var(--line);overflow:hidden;background:#0c0e1e}
.crest svg{width:100%;height:100%;display:block}
.team{display:flex;gap:10px;padding:11px;margin-bottom:10px;position:relative}
.team.full{opacity:.55}
.team.mine{box-shadow:0 4px 0 var(--line), 0 0 0 3px var(--gold)}
.tname{font-size:16.5px;font-weight:800;letter-spacing:1px}
.membar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px}
.mavatar{display:flex;gap:4px;align-items:center;border:2px solid var(--line);background:#111533;padding:2px 6px 2px 2px}
.mavatar svg{width:22px;height:22px}
.mavatar b{font-size:12.5px;font-weight:400}
.mavatar.leader{background:var(--orange);color:#2a1600;font-weight:800}
.draggable{cursor:grab}
.draggable.sel{outline:3px solid var(--cyan);outline-offset:1px}
.dropok{box-shadow:0 4px 0 var(--line), 0 0 0 3px var(--green)}
/* ===== 输入 ===== */
input,select,textarea{width:100%;font-family:inherit;font-size:15px;padding:9px;background:#0a0c1c;color:var(--ink);
  border:3px solid var(--line);box-shadow:inset 0 3px 0 rgba(0,0,0,.55);outline:none}
input:focus,select:focus{border-color:var(--cyan)}
label{display:block;font-size:13px;color:var(--dim);margin:8px 0 4px}
/* ===== 关系网 ===== */
/* ===== 底部 ===== */
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:9px;background:var(--bg2);border-top:3px solid var(--line)}
.foot .btn{flex:1}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:99;background:var(--green);color:#00301a;
  font-weight:800;padding:10px 16px;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);max-width:92%;text-align:center}
.toast.err{background:var(--red);color:#2a0006}
.empty{padding:14px;text-align:center;color:var(--dim);border:3px dashed #2c3160}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){ .grid2,.grid3{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 玩家面板 -->
  <div class="hud pk">
    <div id="myAvatar"></div>
    <div class="plate">
      <div class="pname" id="myName">加载中…</div>
      <div class="tagline" id="myTags"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <div style="display:flex;gap:6px;align-items:center">
        <button class="sm b-ghost" id="refresh" title="重新拉取最新数据">刷新</button>
        <button class="sm b-ghost" id="ntfBtn" title="开启提醒">🔔</button>
        <button class="b-red" id="logoutBtn" title="退出登录"
          style="padding:9px 13px;font-size:15px;letter-spacing:1px">登出</button>
      </div>
      <span class="mut" id="synced" style="font-size:11px;white-space:nowrap"></span>
    </div>
  </div>

  <!-- 任务 -->
  <div class="tabs" id="tabs"></div>

  <!-- 内容 -->
  <div id="invites"></div>
  <div id="mine"></div>
  <div id="lobby"></div>

  <!-- 管理 -->
  <details class="pk sec">
    <summary style="cursor:pointer;font-weight:800;font-size:15px">管理员后台（口令）</summary>
    <div class="row" style="margin-top:8px">
      <input type="password" id="admpw" placeholder="管理员口令" class="grow">
      <button class="b-red" id="admgologin">进入</button>
    </div>
    <div id="admBox"></div>
  </details>
</div>

<div class="foot">
  <a class="btn b-ghost" href="index.html">返回入口</a>
  <button class="b-blue" id="reload2">重新载入</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
const CLS = sessionStorage.getItem('cls');
const CODE = sessionStorage.getItem('code');
const PWD = sessionStorage.getItem('spwd');
if (!CLS || !CODE || !PWD || sessionStorage.getItem('app') !== 'team') location.href = 'student.html';

/* ================= 像素立绘（程序化生成） ================= */
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(seed) { let x = seed || 1; return function () { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function toSVG(cells, N, bg, px) {
  let out = '<rect width="100%" height="100%" fill="' + bg + '"/>';
  cells.forEach(c => { out += '<rect x="' + (c[0] * px) + '" y="' + (c[1] * px) + '" width="' + px + '" height="' + px + '" fill="' + c[2] + '"/>'; });
  return '<svg width="' + (N * px) + '" height="' + (N * px) + '" viewBox="0 0 ' + (N * px) + ' ' + (N * px) +
    '" shape-rendering="crispEdges">' + out + '</svg>';
}
const PAL = ['#ff4d5e', '#3ddc84', '#3d9bff', '#ffb02e', '#b06bff', '#2fe6e6', '#ffd23f', '#ff8fb1'];
function mix(hex, to, k) {
  const a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16);
  const ch = s => Math.round((((a >> s) & 255) * (1 - k)) + (((b >> s) & 255) * k));
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}
const light = (c, k) => mix(c, '#ffffff', k);
const dark = (c, k) => mix(c, '#05060f', k);

/* 队伍纹章：16×16 像素徽章（外框 + 底纹 + 对称纹样） */
const MOTIFS = [
  [ // 宝石
    '................',
    '.......++.......',
    '......####......',
    '.....######.....',
    '....########....',
    '...####--####...',
    '..####----####..',
    '.####------####.',
    '.####------####.',
    '..####----####..',
    '...####--####...',
    '....########....',
    '.....######.....',
    '......####......',
    '.......++.......',
    '................'],
  [ // 兽面
    '................',
    '..#..........#..',
    '.###........###.',
    '.####......####.',
    '..############..',
    '.##############.',
    '.###..####..###.',
    '.##############.',
    '.####.####.####.',
    '..####----####..',
    '...##########...',
    '....##....##....',
    '.....######.....',
    '......####......',
    '.......++.......',
    '................'],
  [ // 星芒
    '................',
    '.......++.......',
    '......####......',
    '.....######.....',
    '....########....',
    '..############..',
    '.####------####.',
    '..####----####..',
    '....########....',
    '...##########...',
    '..####....####..',
    '.###........###.',
    '.##..........##.',
    '.#............#.',
    '................',
    '................'],
  [ // 盾徽
    '................',
    '..++++++++++++..',
    '..############..',
    '..##........##..',
    '..##...##...##..',
    '..##..####..##..',
    '..##.######.##..',
    '..##..####..##..',
    '..##...##...##..',
    '...##..##..##...',
    '....##....##....',
    '.....##..##.....',
    '......####......',
    '.......##.......',
    '................',
    '................'],
  [ // 皇冠
    '................',
    '................',
    '..#..........#..',
    '.###...##...###.',
    '.####..##..####.',
    '.#####.##.#####.',
    '.##############.',
    '.####------####.',
    '.####------####.',
    '.##############.',
    '..############..',
    '..############..',
    '...##########...',
    '....########....',
    '................',
    '................'],
  [ // 闪电
    '................',
    '.........####...',
    '........####....',
    '.......####.....',
    '......####......',
    '.....####.......',
    '....##########..',
    '...##########...',
    '.......####.....',
    '......####......',
    '.....####.......',
    '....####........',
    '...####.........',
    '..###...........',
    '................',
    '................'],
  [ // 独眼
    '................',
    '................',
    '.....######.....',
    '...##########...',
    '..############..',
    '.#####----#####.',
    '.####------####.',
    '.####------####.',
    '.#####----#####.',
    '..############..',
    '...##########...',
    '.....######.....',
    '................',
    '................',
    '................',
    '................'],
  [ // 十字星
    '................',
    '.......##.......',
    '......####......',
    '......####......',
    '..##..####..##..',
    '.####.####.####.',
    '..############..',
    '..############..',
    '.####.####.####.',
    '..##..####..##..',
    '......####......',
    '......####......',
    '.......##.......',
    '................',
    '................',
    '................']
];
const CREST_COLORS = ['#ff4d5e', '#ff7a45', '#ffb02e', '#ffd23f', '#bef264', '#3ddc84',
  '#2fe6e6', '#3d9bff', '#8aa4ff', '#b06bff', '#ff6bd6', '#ff8fb1'];
const CREST_BG = ['#0b0d1c', '#141733', '#1a1030', '#0e2018', '#231427'];

/* 纹章由"种子"生成：同一个种子永远同一枚，和队名完全无关 */
function crestFromSeed(seed, cell) {
  cell = cell || 4;
  const r = rngOf((seed >>> 0) || 2463534242);
  const N = 16;
  const main = CREST_COLORS[Math.floor(r() * CREST_COLORS.length)];
  let accent = CREST_COLORS[Math.floor(r() * CREST_COLORS.length)];
  if (accent === main) accent = CREST_COLORS[(CREST_COLORS.indexOf(main) + 5) % CREST_COLORS.length];
  const third = CREST_COLORS[Math.floor(r() * CREST_COLORS.length)];
  const motif = MOTIFS[Math.floor(r() * MOTIFS.length)];
  const bg = CREST_BG[Math.floor(r() * CREST_BG.length)];
  const bgStyle = Math.floor(r() * 4), cornerStyle = Math.floor(r() * 3);
  const frameStyle = Math.floor(r() * 2), ring = r() < .6, sparkle = r() < .5;

  let out = '<rect x="0" y="0" width="' + N + '" height="' + N + '" fill="' + bg + '"/>';
  // 底纹：斜纹 / 网格 / 点阵 / 双色对角
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let on = false, col = mix(bg, '#ffffff', .07);
    if (bgStyle === 0) { on = (x + y) % 4 === 0; }
    else if (bgStyle === 1) { on = (x % 4 === 0 || y % 4 === 0); }
    else if (bgStyle === 2) { on = (x % 3 === 0 && y % 3 === 0); }
    else { on = (x + y < N); col = mix(bg, main, .12); }
    if (on) out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + col + '"/>';
  }
  // 纹样
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const c = motif[y][x];
    if (c === '.') continue;
    const col = c === '#' ? main : c === '+' ? light(main, .55) : c === '-' ? dark(main, .4) : third;
    out += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + col + '"/>';
  }
  // 外框
  if (frameStyle === 0) {
    out += '<rect x="0" y="0" width="16" height="16" fill="none" stroke="#05060f" stroke-width="2"/>';
  } else {
    out += '<rect x="0" y="0" width="16" height="16" fill="none" stroke="' + accent + '" stroke-width="1"/>';
    out += '<rect x="1.5" y="1.5" width="13" height="13" fill="none" stroke="#05060f" stroke-width="1"/>';
  }
  if (ring) out += '<rect x="2" y="2" width="12" height="12" fill="none" stroke="' + dark(accent, .25) + '" stroke-width="1"/>';
  // 角饰
  let corners;
  if (cornerStyle === 0) corners = [[0, 0], [0, 13], [13, 0], [13, 13]];
  else if (cornerStyle === 1) corners = [[0, 0], [13, 0]];
  else corners = [[0, 0], [13, 13]];
  corners.forEach(c => {
    out += '<rect x="' + c[0] + '" y="' + c[1] + '" width="3" height="3" fill="' + accent + '"/>';
    out += '<rect x="' + (c[0] + 1) + '" y="' + (c[1] + 1) + '" width="1" height="1" fill="' + light(accent, .55) + '"/>';
  });
  // 星点
  if (sparkle) [[3, 3], [12, 12], [3, 12], [12, 3]].forEach(p => {
    if (r() < .45) out += '<rect x="' + p[0] + '" y="' + p[1] + '" width="1" height="1" fill="' + light(third, .6) + '"/>';
  });
  const size = N * cell;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + N + ' ' + N +
    '" shape-rendering="crispEdges">' + out + '</svg>';
}
/* 队伍纹章：用队伍存的种子；没有种子时用队伍 id（都与队名无关） */
function teamCrest(g, cell) {
  if (!g) return crestFromSeed(1, cell);
  const seed = g.crest_seed || (hash('tid:' + (g.id || 'x')) >>> 0);
  return crestFromSeed(seed, cell);
}
function newSeed() { return (Math.random() * 1000000) | 0; }

/* 同学头像：8×8 粗像素小人（由学号决定，保持原来的粗糙感） */
function avatar(code, px) {
  px = px || 3;
  const r = rngOf(hash('av:' + code));
  const skin = ['#ffd7a8', '#f3c69b', '#e6b083', '#d99a63'][Math.floor(r() * 4)];
  const hair = ['#2b2d42', '#5c3b1e', '#8b5a2b', '#1b1b1f', '#6b7280'][Math.floor(r() * 5)];
  const shirt = PAL[Math.floor(r() * PAL.length)];
  const N = 8, g = [];
  for (let y = 0; y < N; y++) { g.push([]); for (let x = 0; x < N; x++) g[y].push(null); }
  const set = (x, y, c) => { if (x >= 0 && x < N && y >= 0 && y < N) g[y][x] = c; };
  for (let x = 1; x < 7; x++) { set(x, 0, hair); set(x, 1, hair); }
  set(0, 1, hair); set(7, 1, hair);
  for (let y = 2; y < 6; y++) for (let x = 1; x < 7; x++) set(x, y, skin);
  const ey = r() < .5 ? 3 : 4;
  set(2, ey, '#0b0b12'); set(5, ey, '#0b0b12');
  set(3, 5, '#a83b3b'); set(4, 5, '#a83b3b');
  for (let x = 1; x < 7; x++) { set(x, 6, shirt); set(x, 7, shirt); }
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (g[y][x]) cells.push([x, y, g[y][x]]);
  return toSVG(cells, N, '#0c0e1e', px);
}
function slots(n, cap) {
  let s = '';
  for (let i = 0; i < cap; i++) s += '<span class="slotdot' + (i < n ? ' on' : '') + '"></span>';
  return s;
}
/* 队伍显示名：队名（第N组），不再自动加队字 */
const CN = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
function cn(n) {
  n = parseInt(n, 10);
  if (!n || n < 1) return '';
  if (n <= 10) return n === 10 ? '十' : CN[n];
  if (n < 20) return '十' + CN[n - 10];
  const t = Math.floor(n / 10), o = n % 10;
  return CN[t] + '十' + (o ? CN[o] : '');
}
function dispName(g) {
  if (!g) return '';
  let base = String(g.name || '');
  if (g.seq) {
    const num = cn(g.seq);
    // 方案 C：一律加组号；但名字里已经写着同一个号（如"第一组"就是第1组）就不重复加
    const same = new RegExp('第\\s*' + num + '\\s*(大)?组$').test(base);
    if (!same) base += '（第' + num + '组）';
  }
  return base;
}

/* ================= 状态 ================= */
let ST = null, CUR = null, ADM = null, ADMPW = sessionStorage.getItem('admpw') || '', selCode = null;
let pickSeed = 0;
let lastSig = '', lastAdmSig = '', lastTouch = 0, busy = false;

// 记录用户操作时间：滚动/触摸/输入期间不刷新，避免画面跳动
['scroll', 'touchstart', 'touchmove', 'wheel', 'pointerdown', 'keydown',
  'focusin', 'input', 'change'].forEach(ev =>
    window.addEventListener(ev, () => { lastTouch = Date.now(); }, { passive: true }));

// 正在填表（选日期、选人、输入）时，不要刷新
function editing() {
  const a = document.activeElement;
  if (!a) return false;
  if (a.closest && a.closest('#admBox')) return true;
  return /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
}

/* ================= 提醒（震动 / 标题闪烁 / 系统通知，无声音） ================= */
let titleTimer = null;
const TITLE = '组队大厅';
function buzz() { try { navigator.vibrate && navigator.vibrate([70, 60, 140]); } catch (e) { } }
function blinkTitle(n) {
  clearInterval(titleTimer);
  let on = false;
  titleTimer = setInterval(() => { document.title = (on = !on) ? '（' + n + '）新消息！' : TITLE; }, 900);
}

function notifyNew(list) {

function diffEvents(prev, now) {
  const ev = [];
  if (!prev) return ev;
  const pid = new Set((prev.invites || []).map(x => x.id));
  (now.invites || []).forEach(v => { if (!pid.has(v.id)) ev.push('「' + v.team_name + '」邀请你加入'); });
  const pq = new Set((prev.my_requests || []).map(r => r.id));
  const nq = new Set((now.my_requests || []).map(r => r.id));
  pq.forEach(id => { if (!nq.has(id)) ev.push('你有一条申请已被处理'); });
  if (!(prev.leader_tasks || []).length && (now.leader_tasks || []).length) ev.push('你已被批准为组长，可以建队了');
  const pg = new Set((prev.my_groups || []).map(g => g.task_id + ':' + g.team_id));
  (now.my_groups || []).forEach(g => { if (!pg.has(g.task_id + ':' + g.team_id)) ev.push('你已加入一支队伍'); });
  return ev;
}
function copyText(s) {

  const fallback = () => {

    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请长按手动复制', true); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, fallback);
  else fallback();
}

// 带超时 + 自动重试的请求：手机网络不稳时不会再一直卡在"加载中"
async function call(fn, body, tries) {
  const n = tries || 3;
  let lastErr = '';
  for (let i = 0; i < n; i++) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch(C.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: C.SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY
        },
        body: JSON.stringify(body),
        signal: ctl.signal
      });
      clearTimeout(timer);
      if (!r.ok) { lastErr = 'HTTP ' + r.status; }
      else {
        const j = await r.json();
        if (j && typeof j === 'object') return j;
        lastErr = '返回格式异常';
      }
    } catch (e) {
      lastErr = (e && e.name === 'AbortError') ? '请求超时' : String((e && e.message) || e);
    }
    if (i < n - 1) await new Promise(res => setTimeout(res, 700 + i * 1500));
  }
  return { ok: false, net: true, msg: '连不上服务器（' + lastErr + '），点下面重试' };
}
function me() { return { p_cls: CLS, p_code: CODE, p_pwd: PWD }; }
function P(o) { return Object.assign({}, me(), o); }
function gOf(t) { return (ST.my_groups || []).find(x => x.task_id === t); }
function teamsOf(t) { return (ST.teams || []).filter(x => x.task_id === t); }
function unOf(t) { return (ST.ungrouped || []).filter(x => x.task_id === t); }
function nameOf(code) { const c = (ST.classmates || []).find(x => x.code === code); return c ? c.name : code; }
function canCreate(t) { return (ST.leader_tasks || []).indexOf(t) >= 0; }

async function load(keep, force) {
  // 1) 用户正在滑动或正在填表：先不刷新（防止画面跳动、表单被重置）
  if (!force && (Date.now() - lastTouch < 1500 || editing())) return;
  if (busy && !force) return;          // 手动刷新时即使正在轮询也照做
  busy = true;
  const y = window.scrollY;
  let j;
  try { j = await call('team_state', me()); } finally { busy = false; }
  if (!j.ok) {
    setStatus('未连接');
    $('#lobby').innerHTML = '<div class="pk sec"><h2>' + (j.net ? '连接失败' : '读取失败') + '</h2>' +
      '<div class="mut">' + esc(j.msg || '') + '</div>' +
      (j.net ? '<div class="mut" style="margin-top:4px">网络不好或服务器在唤醒（免费版闲置后会休眠，第一次要等十几秒）。</div>' : '') +
      '<div class="row" style="margin-top:10px"><button class="b-blue" id="retryBtn">重试</button></div></div>';
    const rb = $('#retryBtn');
    if (rb) rb.onclick = () => hardRefresh();
    return;
  }
  // 2) 数据没变化：完全不碰 DOM（这是跳动的根源）
  const sig = JSON.stringify(j);
  if (sig === lastSig) {
    stamp();
    if (ADMPW) loadAdmin(true);
    return;
  }
  lastSig = sig;

  const events = diffEvents(ST, j);      // 与上一次对比，找出新消息
  ST = j;
  if (!CUR && ST.tasks.length) CUR = ST.tasks[0].id;
  render();
  stamp();
  if (events.length) notifyNew(events);
  // 3) 用 rAF 恢复滚动位置，避免重排瞬间的抖动
  if (keep) requestAnimationFrame(() => window.scrollTo(0, y));
  if (ADMPW) loadAdmin(true);
}
function refreshNow() { return load(true, true); }

// 安全地显示"正在连接/未连接"等状态（元素不存在也不会抛错）
function setStatus(text) {
  const el = document.querySelector('#myTags') || document.querySelector('#who');
  if (el) el.innerHTML = '<span class="mut">' + text + '</span>';
}

function stamp() {
  const el = $('#synced');
  if (el) el.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 8) + ' 已同步';
}

// 真正的"刷新"：清掉缓存签名 → 一定重新拉取并重绘，带按钮转态和提示
async function hardRefresh() {
  lastSig = ''; lastAdmSig = ''; lastTouch = 0;
  const btn = $('#refresh');
  if (btn) { btn.disabled = true; btn.textContent = '刷新中'; }
  try {
    await load(true, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '刷新'; }
    stopBlink();
    stamp();
    toast('已刷新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }).slice(0, 8));
  }
}

function admKey(el) {
  if (!el) return null;
  if (el.dataset.f) return 'f:' + el.dataset.f + ':' + (el.dataset.id || '');
  if (el.dataset.seq) return 'seq:' + el.dataset.seq;
  if (el.dataset.newlead) return 'lead:' + el.dataset.newlead;
  if (el.dataset.rn) return 'rn:' + el.dataset.rn;
  if (['aCode', 'cWho', 'aLTask', 'cTask'].indexOf(el.id) >= 0) return 'id:' + el.id;
  if (el.dataset.rns) return 'rns:' + el.dataset.rns;
  if (el.dataset.mvcode) return 'mvc:' + el.dataset.mvcode;
  if (el.dataset.mvto) return 'mvt:' + el.dataset.mvto;
  if (el.id) return 'id:' + el.id;
  return null;
}
function admSnap() {
  const s = { vals: {}, open: [], focus: null };
  if (!ADM) return s;
  document.querySelectorAll('#admBox input, #admBox select').forEach(el => {
    const k = admKey(el);
    if (k) s.vals[k] = el.value;
  });
  document.querySelectorAll('#admBox details').forEach((d, i) => { if (d.open) s.open.push(i); });
  const a = document.activeElement;
  if (a && a.closest && a.closest('#admBox')) s.focus = admKey(a);
  return s;
}
function admRestore(s) {
  if (!s) return;
  const els = [].slice.call(document.querySelectorAll('#admBox input, #admBox select'));
  els.forEach(el => {
    const k = admKey(el);
    if (k && s.vals[k] !== undefined) el.value = s.vals[k];
  });
  document.querySelectorAll('#admBox details').forEach((d, i) => { if (s.open.indexOf(i) >= 0) d.open = true; });
  if (s.focus) {
    const el = els.find(x => admKey(x) === s.focus);
    if (el && el !== document.activeElement) { try { el.focus({ preventScroll: true }); } catch (e) { } }
  }
}
async function loadAdmin(silent) {
  if (!ADMPW) return;
  const j = await call('team_admin_state', { p_password: ADMPW });
  if (!j.ok) {
    if (!silent) { toast(j.msg || '口令错误', true); sessionStorage.removeItem('admpw'); ADMPW = ''; lastAdmSig = ''; }
    return;
  }
  const sig = JSON.stringify(j);
  if (sig === lastAdmSig) return;      // 后台数据没变化 → 不重绘，表单不被打断
  lastAdmSig = sig;
  ADM = j;
  renderAdmin();
}
function renderAdmin() {
  if (!ADM) return;
  const snap = admSnap();          // 记住当前表单里的选择和展开状态
  const reqs = ADM.requests || [];
  let h = '<div class="row" style="margin-top:10px"><b class="grow">待审批 ' + reqs.length + '</b></div>';
  h += reqs.length ? reqs.map(q => {
    const txt = q.kind === 'leader_apply' ? '申请当组长'
      : q.kind === 'take_leader' ? '申请当本队队长'
        : q.kind === 'kick' ? '申请踢人' : '申请退组';
    const who = q.kind === 'kick' ? (esc(q.from_name) + ' → 踢出 ' + esc(q.target_name)) : esc(q.from_name);
    return '<div class="pk inset" style="padding:8px;margin:6px 0"><div class="row">' +
      '<span class="grow">' + txt + ' · ' + esc(q.task_id || '') + '<br><span class="mut">' + who + '（' + esc(q.from_code) + '）</span></span>' +
      '<button class="b-green sm" data-ap="' + esc(q.id) + '">批准</button>' +
      '<button class="b-ghost sm" data-rj="' + esc(q.id) + '">驳回</button></div></div>';
  }).join('') : '<div class="mut">没有待处理申请</div>';

  // 任务设置
  h += '<div style="margin-top:12px"><h2>任务设置</h2>';
  (ADM.tasks || []).forEach(t => {
    h += '<div class="pk inset" style="padding:8px;margin-bottom:8px">' +
      '<b>' + esc(t.title) + '</b> <span class="mut">' + esc(t.id) + '</span>' +
      '<div class="grid3" style="margin-top:6px">' +
      '<div><label>每组人数</label><input type="number" min="2" max="12" value="' + t.size + '" data-f="size" data-id="' + esc(t.id) + '"></div>' +
      '<div><label>备注</label><input value="' + esc(t.size_note || '') + '" data-f="note" data-id="' + esc(t.id) + '"></div>' +
      '<div><label>状态</label><select data-f="status" data-id="' + esc(t.id) + '">' +
      ['open', 'closed', 'done'].map(s => '<option value="' + s + '"' + (t.status === s ? ' selected' : '') + '>' + s + '</option>').join('') +
      '</select></div></div>' +
      '<label>截止时间（到期后可一键自动分配）</label>' +
      '<input type="datetime-local" value="' + (t.deadline ? String(t.deadline).slice(0, 16) : '') + '" data-f="deadline" data-id="' + esc(t.id) + '">' +
      '<div class="row" style="margin-top:8px">' +
      '<button class="b-blue sm" data-save="' + esc(t.id) + '">保存</button>' +
      '<button class="b-orange sm" data-auto="' + esc(t.id) + '">自动分配未入组的人</button>' +
      '</div>' +
      '<div class="mut" style="margin-top:4px">改「每组人数」保存后，这个任务下<b>所有队伍的容量</b>会一起改成新值。</div>' +
      '</div>';
  });
  h += '</div>';

  // 队伍排序（名字 → 队名（第N组））
  h += '<div style="margin-top:12px"><h2>队伍排序（名字后面自动加（第N组））</h2>' +
    '<div class="mut">点 ↑↓ 调顺序，或直接填序号再点「存」；「按当前顺序重编号」会从 1 开始依次编号。名字会显示成夜行者（第一组）这样。</div>';
  (ADM.tasks || []).forEach(t => {
    const ts = (ADM.teams || []).filter(x => x.task_id === t.id);
    if (!ts.length) return;
    h += '<div class="pk inset" style="padding:8px;margin:8px 0"><div class="row">' +
      '<b class="grow">' + esc(t.title) + '（' + ts.length + ' 队）</b>' +
      '<button class="b-blue sm" data-renum="' + esc(t.id) + '">按当前顺序重编号</button></div>';
    ts.forEach((g, i) => {
      h += '<div class="row" style="margin-top:6px">' +
        '<span class="grow">' + (i + 1) + '. ' + esc(dispName(g)) +
        ' <span class="mut">' + (g.members || []).length + '人</span></span>' +
        '<input type="number" min="1" max="99" value="' + (g.seq || '') + '" style="max-width:74px" data-seq="' + esc(g.id) + '">' +
        (i > 0 ? '<button class="b-ghost sm" data-up="' + esc(g.id) + '" data-prev="' + esc(ts[i - 1].id) + '">↑</button>' : '') +
        (i < ts.length - 1 ? '<button class="b-ghost sm" data-dn="' + esc(g.id) + '" data-next="' + esc(ts[i + 1].id) + '">↓</button>' : '') +
        '<button class="b-green sm" data-saveseq="' + esc(g.id) + '">存</button></div>';
    });
    h += '</div>';
  });
  h += '</div>';

  // 指派组长
  const mates = ADM.classmates || [];
  h += '<div style="margin-top:12px"><h2>给某人建队权（他就成了组长）</h2><div class="row">' +
    '<select id="aLTask" class="grow">' + (ADM.tasks || []).map(t => '<option value="' + esc(t.id) + '">' + esc(t.title) + '</option>').join('') + '</select>' +
    '<select id="aCode" class="grow">' + mates.map(m =>
      '<option value="' + esc(m.code) + '">' + esc(m.name) + '</option>').join('') + '</select>' +
    '<button class="b-orange sm" id="aMake">给他建队权</button></div>' +
    '<div class="mut" style="margin-top:4px">给了之后，他自己就能在建队页面创建队伍并拉人。给已有队伍换队长：点队伍里的"换组长"。</div></div>';

  // 直接替某人把队建好
  h += '<div style="margin-top:12px"><h2>直接给某人建队（他当队长）</h2><div class="row">' +
    '<select id="cTask" class="grow">' + (ADM.tasks || []).map(t => '<option value="' + esc(t.id) + '">' + esc(t.title) + '</option>').join('') + '</select>' +
    '<select id="cWho" class="grow">' + mates.map(m =>
      '<option value="' + esc(m.code) + '">' + esc(m.name) + '</option>').join('') + '</select>' +
    '<input id="cName" placeholder="队名（可留空）" style="max-width:130px">' +
    '<button class="b-green sm" id="cMake">建队</button></div>' +
    '<div class="mut" style="margin-top:4px">队名留空会自动叫"第N组"；建好后他就能自己拉人。</div></div>';

  // 组长资格（可撤销）
  const leads = ADM.leaders || [];
  h += '<div style="margin-top:12px"><h2>组长资格（已批准 ' + leads.length + ' 人）</h2>' +
    '<div class="mut">撤销后他不能再建新队；已经建好的队不受影响，可以用"换组长"或"队长卸任"处理。</div>';
  h += leads.length ? leads.map(L =>
    '<div class="row" style="margin-top:6px"><span class="grow">' + esc(L.name) + '（' + esc(L.code) + '）' +
    ' <span class="mut">' + esc(L.task_id) + '</span></span>' +
    '<button class="b-red sm" data-revoke="' + esc(L.code) + '|' + esc(L.task_id) + '">撤销组长资格</button></div>').join('')
    : '<div class="mut">还没有已批准的组长</div>';
  h += '</div>';

  // 调组（点选 + 拖拽）
  h += '<div style="margin-top:12px"><h2>调组（原组留空）</h2>' +
    '<div class="mut">电脑可拖拽成员到目标队伍；手机先点成员（会高亮），再点目标队伍。</div>';
  (ADM.tasks || []).forEach(t => {
    const ts = (ADM.teams || []).filter(x => x.task_id === t.id);
    if (!ts.length) return;
    const un = (ADM.ungrouped || []).filter(u => u.task_id === t.id);
    h += '<details style="margin-top:6px"><summary style="cursor:pointer">' + esc(t.title) + '（' + ts.length + ' 队）</summary>';
    // 直接把未分组的人加进某个队
    h += '<div class="pk inset" style="padding:8px;margin:6px 0;background:#16233a">' +
      '<b>把未分组的人加进队伍</b>' +
      '<div class="row" style="margin-top:6px">' +
      '<select id="addWho_' + esc(t.id) + '" class="grow">' +
      (un.length ? un.map(u => '<option value="' + esc(u.code) + '">' + esc(u.name) + '</option>').join('')
        : '<option value="">（这个任务没有未分组的人）</option>') +
      '</select>' +
      '<select id="addTo_' + esc(t.id) + '" style="max-width:170px">' +
      ts.map(g => '<option value="' + esc(g.id) + '">' + esc(dispName(g)) + ' ' + (g.members || []).length + '/' + g.capacity + '</option>').join('') +
      '</select>' +
      '<button class="b-green sm" data-addmem="' + esc(t.id) + '">加进去</button></div>' +
      '<div class="mut" style="margin-top:4px">只能加"这个任务里还没队伍"的人；已经在本任务别的队里的人，用调组或先移出。</div>' +
      '</div>';
    ts.forEach(g => {
      h += '<div class="pk inset team" data-dropteam="' + esc(g.id) + '" data-task="' + esc(t.id) + '" style="padding:8px;margin:6px 0">' +
        '<div class="crest" style="width:52px;height:52px">' + teamCrest(g, 3.25) + '</div>' +
        '<div class="grow"><b>' + esc(dispName(g)) + '</b> <span class="mut">' + (g.members || []).length + '/' + g.capacity + '</span>' +
        '<div class="membar">' + (g.members || []).map(m =>
          '<span class="mavatar draggable' + (m.role === 'leader' ? ' leader' : '') + '" draggable="true" data-code="' + esc(m.code) + '">' +
          avatar(m.code, 2.6) + '<b>' + esc(m.name) + '</b>' +
          '<button class="b-red sm" style="padding:0 5px;font-size:12px;margin-left:4px" data-rmmem="' +
          esc(t.id) + '|' + esc(m.code) + '" title="移出该队">✕</button></span>').join('') + '</div>' +
        '<div class="row" style="margin-top:6px">' +
        '<input value="' + esc(g.name) + '" data-rn="' + esc(g.id) + '" style="max-width:140px" title="队名">' +
        '<input value="' + esc(g.slogan || '') + '" data-rns="' + esc(g.id) + '" placeholder="口号" style="max-width:140px">' +
        '<button class="b-blue sm" data-rename="' + esc(g.id) + '">改名</button>' +
        '<button class="b-red sm" data-delteam="' + esc(g.id) + '" data-dname="' + esc(dispName(g)) + '">🗑 删组</button>' +
        '</div>' +
        '<div class="row" style="margin-top:6px">' +
        '<select data-newlead="' + esc(g.id) + '" style="max-width:160px">' +
        (g.members || []).map(m => '<option value="' + esc(m.code) + '">' + esc(m.name) + '</option>').join('') + '</select>' +
        '<button class="b-purple sm" data-setlead="' + esc(g.id) + '">换组长</button>' +
        (g.leader_code ? '<button class="b-ghost sm" data-demote="' + esc(g.id) + '">队长卸任</button>' : '<span class="mut">无队长</span>') +
        '<button class="b-ghost sm" data-reroll="' + esc(g.id) + '" title="换纹章">🎲</button>' +
        '</div></div></div>';
    });
    h += '</details>';
  });
  h += '</div>';

  const un = ADM.ungrouped || [];
  h += '<div style="margin-top:12px"><h2>未分组总览（' + un.length + '）</h2>' +
    (un.length ? '<div class="mut">' + un.map(u => esc(u.task_title) + '：' + esc(u.name)).join('　') + '</div>'
      : '<div class="mut">所有任务都已分好</div>') + '</div>';

  $('#admBox').innerHTML = h;
  admRestore(snap);                // 重绘后把选择/展开还原回去

  wire('[data-ap]', b => call('team_admin_decide', { p_password: ADMPW, p_request: b.dataset.ap, p_approve: true }));
  wire('[data-rj]', b => call('team_admin_decide', { p_password: ADMPW, p_request: b.dataset.rj, p_approve: false }));
  wire('[data-save]', async b => {
    const id = b.dataset.save;
    const val = f => { const el = document.querySelector('[data-f="' + f + '"][data-id="' + id + '"]'); return el ? el.value : ''; };
    const t = (ADM.tasks || []).find(x => x.id === id) || {};
    return call('team_task_upsert', {
      p_password: ADMPW, p_id: id, p_title: t.title || id,
      p_size: parseInt(val('size') || t.size || 5, 10), p_size_note: val('note'),
      p_deadline: val('deadline') ? new Date(val('deadline')).toISOString() : '',
      p_status: val('status'), p_auto_rule: t.auto_rule || {}
    });
  });
  wire('[data-auto]', b => {
    if (!confirm('把这个任务里所有未入组的人随机分配（尊重搭档关系、优先已有组长）？')) return null;
    return call('team_autofill', { p_password: ADMPW, p_task: b.dataset.auto });
  });
  const cm = $('#cMake');
  if (cm) cm.onclick = async () => {
    const code = $('#cWho').value;
    if (!code) { toast('请先选一个人', true); return; }
    if (!confirm('给这位同学建一支队？他会成为该队队长。')) return;
    const r = await call('team_admin_create_team', {
      p_password: ADMPW, p_task: $('#cTask').value, p_code: code,
      p_name: $('#cName').value.trim(), p_slogan: ''
    });
    toast(r.msg || '', !r.ok); refreshNow();
  };
  const mk = $('#aMake');
  if (mk) mk.onclick = async () => {
    const code = $('#aCode').value;
    if (!code) { toast('请先选一个人', true); return; }
    const r = await call('team_admin_make_leader', { p_password: ADMPW, p_task: $('#aLTask').value, p_code: code });
    toast(r.msg || '', !r.ok); refreshNow();
  };
  wire('[data-setlead]', b => {
    const code = document.querySelector('[data-newlead="' + b.dataset.setlead + '"]').value;
    return call('team_admin_set_leader', { p_password: ADMPW, p_team: b.dataset.setlead, p_code: code });
  });
  wire('[data-renum]', b => call('team_admin_renumber', { p_password: ADMPW, p_task: b.dataset.renum }));
  wire('[data-saveseq]', b => {
    const el = document.querySelector('[data-seq="' + b.dataset.saveseq + '"]');
    const v = el && el.value ? parseInt(el.value, 10) : null;
    return call('team_admin_set_seq', { p_password: ADMPW, p_team: b.dataset.saveseq, p_seq: v });
  });
  wire('[data-up]', b => call('team_admin_swap', { p_password: ADMPW, p_a: b.dataset.prev, p_b: b.dataset.up }));
  wire('[data-dn]', b => call('team_admin_swap', { p_password: ADMPW, p_a: b.dataset.next, p_b: b.dataset.dn }));
  wire('[data-reroll]', b => call('team_admin_reroll_crest', { p_password: ADMPW, p_team: b.dataset.reroll }));
  wire('[data-rename]', b => {
    const id = b.dataset.rename;
    const nm = document.querySelector('[data-rn="' + id + '"]');
    const sl = document.querySelector('[data-rns="' + id + '"]');
    return call('team_admin_rename', {
      p_password: ADMPW, p_team: id, p_name: nm ? nm.value : '', p_slogan: sl ? sl.value : ''
    });
  });
  wire('[data-delteam]', b => {
    if (!confirm('把「' + b.dataset.dname + '」整队删除？\n该队所有人会变回未分组，不能撤销。')) return null;
    return call('team_admin_delete_team', { p_password: ADMPW, p_team: b.dataset.delteam });
  });
  wire('[data-demote]', b => {
    if (!confirm('让这个队的队长卸任？该队会变成无队长。')) return null;
    return call('team_admin_demote', { p_password: ADMPW, p_team: b.dataset.demote });
  });
  wire('[data-revoke]', b => {
    const parts = b.dataset.revoke.split('|');
    if (!confirm('撤销该同学的组长资格？')) return null;
    return call('team_admin_revoke_apply', { p_password: ADMPW, p_task: parts[1], p_code: parts[0] });
  });
  wire('[data-addmem]', b => {
    const task = b.dataset.addmem;
    const who = document.getElementById('addWho_' + task);
    const to = document.getElementById('addTo_' + task);
    if (!who || !who.value) { toast('这个任务没有未分组的人', true); return null; }
    if (!to || !to.value) { toast('还没有队伍可以加入', true); return null; }
    return call('team_admin_add_member', { p_password: ADMPW, p_task: task, p_code: who.value, p_team: to.value });
  });
  wire('[data-rmmem]', b => {
    const p = b.dataset.rmmem.split('|');
    if (!confirm('把这位同学移出该队？（他会变成未分组）')) return null;
    return call('team_admin_remove_member', { p_password: ADMPW, p_task: p[0], p_code: p[1] });
  });

  // 拖拽 / 点选调组
  let dragCode = null;
  document.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('dragstart', e => { dragCode = el.dataset.code; e.dataTransfer.setData('text/plain', dragCode); });
    el.onclick = () => {
      document.querySelectorAll('.draggable').forEach(x => x.classList.remove('sel'));
      if (selCode === el.dataset.code) { selCode = null; toast('已取消选择'); return; }
      selCode = el.dataset.code; el.classList.add('sel');
      toast('已选中 ' + nameOf(selCode) + '，再点目标队伍');
    };
  });
  document.querySelectorAll('[data-dropteam]').forEach(z => {
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('dropok'); });
    z.addEventListener('dragleave', () => z.classList.remove('dropok'));
    z.addEventListener('drop', async e => {
      e.preventDefault(); z.classList.remove('dropok');
      const code = dragCode || e.dataTransfer.getData('text/plain');
      await moveTo(code, z.dataset.dropteam, z.dataset.task);
    });
    z.onclick = async e => {
      if (!selCode || e.target.closest('.draggable') || e.target.closest('button') || e.target.closest('select')) return;
      await moveTo(selCode, z.dataset.dropteam, z.dataset.task);
    };
  });
  async function moveTo(code, team, task) {
    if (!code) { toast('先选一个成员', true); return; }
    const r = await call('team_admin_move', { p_password: ADMPW, p_task: task, p_code: code, p_team: team });
    toast(r.msg || '', !r.ok);
    selCode = null; refreshNow();
  }
}

/* ---------- 事件 ---------- */
$('#refresh').onclick = () => hardRefresh();
$('#reload2').onclick = () => location.reload();
$('#logoutBtn').onclick = () => {
  if (!confirm('确定退出登录？\n退出后下次进来要重新输口令。')) return;
  ['cls', 'code', 'spwd', 'app', 'sname', 'role', 'admpw'].forEach(k => sessionStorage.removeItem(k));
  try { localStorage.removeItem('kb_auto'); } catch (e) { }
  location.href = 'index.html';
};
$('#ntfBtn').onclick = async () => {
  if (!window.Notification) { toast('这个浏览器不给网页发系统通知，页面开着时的提醒仍然有效', true); return; }
  try {
    const p = await Notification.requestPermission();
    if (p === 'granted') { $('#ntfBtn').textContent = '🔔✓'; toast('已开启提醒：页面在后台时也尽量通知你'); }
    else toast('没有开启系统通知，页面开着时仍会响铃、闪烁、震动', true);
  } catch (e) { toast('开启失败，请用浏览器直接打开（微信内可能不支持）', true); }
};
if (window.Notification && Notification.permission === 'granted') $('#ntfBtn').textContent = '🔔✓';
$('#admgologin').onclick = () => {
  ADMPW = $('#admpw').value.trim();
  if (!ADMPW) { toast('请输入管理员口令', true); return; }
  sessionStorage.setItem('admpw', ADMPW); loadAdmin(false);
};
if (ADMPW) $('#admpw').value = ADMPW;

// 切回页面：立刻查一次，并提示离开期间的新消息
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  stopBlink();
  refreshNow();
});

// 首次进入：先给个"正在连接"的提示，别让人以为卡死了
setStatus('正在连接…');
$('#lobby').innerHTML = '<div class="pk sec"><div class="mut">正在连接服务器…</div></div>';

(async function boot() {
  await load(true, true);
  if (!ST) {                       // 第一次没成功，3 秒后自动再试一次
    setStatus('连接较慢，重试中…');
    setTimeout(() => load(true, true), 3000);
  }
})();

// 自适应轮询：前台 4 秒，后台 20 秒（手机后台会被系统限速，属正常）
(function poll() {
  const wait = document.hidden ? 20000 : 4000;
  setTimeout(() => { load(true).finally(poll); }, wait);
})();

// 从别的页面/后台返回时（含微信里切回），立刻刷新一次
window.addEventListener('pageshow', e => { if (e.persisted) refreshNow(); });
</script>
</body>
</html>
