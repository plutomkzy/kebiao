<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>学生评分 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="head">
      <span class="seal">生</span>
      <h1 id="title">小组讲解评分</h1>
      <div class="sub" id="sub"></div>
      <div class="note" id="bind"></div>
    </div>

    <div class="groups" id="groups"></div>
    <div class="groups" id="subgroups"></div>

    <details class="keys">
      <summary>修改我的口令</summary>
      <div class="fblock">
        <input type="password" id="sold" placeholder="原口令">
        <input type="password" id="snew1" placeholder="新口令（4-50位）">
        <input type="password" id="snew2" placeholder="确认新口令">
        <button class="btn small" id="schpw" style="margin-top:8px">更新口令</button>
        <div id="spwmsg" style="text-align:center;color:var(--red);min-height:22px"></div>
      </div>
    </details>

    <div id="items"></div>

    <div class="row">
      <input type="checkbox" id="anon" checked style="width:22px;height:22px;margin:0">
      <label for="anon" style="cursor:pointer">匿名评分</label>
    </div>
    <div id="nameRow" style="display:none">
      <input type="text" id="name" placeholder="姓名（记名评分时填写）" maxlength="20">
    </div>
    <textarea id="comment" placeholder="评语（选填）"></textarea>

    <button class="btn primary" id="submit" style="margin-top:20px">提交评分</button>
    <div id="msg"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
const CLS = sessionStorage.getItem('cls');
if (!CLS || !sessionStorage.getItem('code') || !sessionStorage.getItem('spwd') || sessionStorage.getItem('role') !== 'student') location.href = 'student.html';
const CFG = cfgOf(CLS);
let cid = null, cur = 1, sub = 1, scores = [];
const voted = JSON.parse(localStorage.getItem('voted') || '{}');
const key = () => uid(CLS, cur, sub);
const STD = CFG.mode === 'standard';
const itemCount = STD ? CFG.items.length : CFG.studentItems.length;

function paintStars(el, val) {
  el.querySelectorAll('span').forEach((s, i) => s.classList.toggle('on', i < val));
}
function renderGroups() {
  const box = $('#groups');
  box.innerHTML = '';
  CFG.groups.forEach((n, i) => {
    const g = i + 1;
    const b = document.createElement('button');
    b.className = 'gchip' + (g === cur ? ' on' : '');
    b.textContent = '第' + g + '大组';
    b.onclick = () => { cur = g; renderGroups(); renderSubGroups(); loadVoted(); };
    box.appendChild(b);
  });
  renderSubGroups();
}
function renderSubGroups() {
  const box = $('#subgroups');
  box.innerHTML = '';
  for (let s = 1; s <= CFG.groups[cur - 1]; s++) {
    const b = document.createElement('button');
    b.className = 'gchip' + (s === sub ? ' on' : '') + (voted[uid(CLS, cur, s)] ? ' done' : '');
    b.textContent = '第' + s + '小组';
    b.onclick = () => { sub = s; renderSubGroups(); loadVoted(); };
    box.appendChild(b);
  }
}
function renderItems() {
  $('#title').textContent = CFG.name + ' · 小组讲解评分';
  $('#sub').textContent = STD
    ? '每项 1—5 星 · 共十项 · 请对正在展示的小组评分'
    : '每项 0—100 分 · 共五项 · 请对正在展示的搭档评分';
  const box = $('#items');
  box.innerHTML = '';
  scores = Array(itemCount).fill(0);
  for (let i = 0; i < itemCount; i++) {
    const div = document.createElement('div');
    div.className = 'item';
    if (STD) {
      div.innerHTML =
        '<div class="ihead"><div><div class="iname"><span class="no">' + (i + 1) + '</span>' + CFG.items[i][0] + '</div>' +
        '<div class="ihint">' + CFG.items[i][1] + '</div></div>' +
        '<div class="stars">' + '<span>★</span>'.repeat(5) + '</div></div>';
      box.appendChild(div);
      const el = div.querySelector('.stars');
      el.querySelectorAll('span').forEach((sp, k) => {
        sp.onclick = () => { scores[i] = k + 1; paintStars(el, scores[i]); };
      });
    } else {
      div.innerHTML =
        '<div class="iname"><span class="no">' + (i + 1) + '</span>' + CFG.studentItems[i] + '</div>' +
        '<div class="slider-row">' +
        '<button class="stepbtn minus">−</button>' +
        '<input type="range" class="slider" min="0" max="100" step="1" value="0">' +
        '<button class="stepbtn plus">＋</button>' +
        '<span class="sval">0</span><span class="smax">/100</span></div>';
      box.appendChild(div);
      const sl = div.querySelector('.slider');
      const paint = () => { div.querySelector('.sval').textContent = scores[i]; sl.value = scores[i]; };
      sl.oninput = () => { scores[i] = Math.min(100, Math.max(0, parseInt(sl.value, 10) || 0)); paint(); };
      div.querySelector('.minus').onclick = () => { scores[i] = Math.max(0, scores[i] - 1); paint(); };
      div.querySelector('.plus').onclick = () => { scores[i] = Math.min(100, scores[i] + 1); paint(); };
    }
  }
}
function loadVoted() {
  const v = voted[key()];
  scores = v && v.scores ? v.scores.slice() : Array(itemCount).fill(0);
  $('#anon').checked = v ? !!v.anonymous : true;
  $('#name').value = v ? (v.name || '') : '';
  $('#comment').value = v ? (v.comment || '') : '';
  toggleName();
  if (STD) {
    $('#items').querySelectorAll('.item').forEach((el, i) => {
      paintStars(el.querySelector('.stars'), scores[i]);
    });
  } else {
    $('#items').querySelectorAll('.item').forEach((el, i) => {
      el.querySelector('.slider').value = scores[i];
      el.querySelector('.sval').textContent = scores[i];
    });
  }
  $('#msg').textContent = v ? '该小组已评分，可修改后重新提交' : '';
}
function toggleName() { $('#nameRow').style.display = $('#anon').checked ? 'none' : 'block'; }

async function init() {
  cid = localStorage.getItem('cid');
  if (!cid) {
    cid = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2);
    localStorage.setItem('cid', cid);
  }
  renderGroups(); renderItems(); loadVoted();
  $('#bind').textContent = '绑定：' + (sessionStorage.getItem('sname') || '') + '（' + sessionStorage.getItem('code') + '）';
  $('#anon').onchange = toggleName;
  $('#schpw').onclick = async () => {
    const o = $('#sold').value, n1 = $('#snew1').value, n2 = $('#snew2').value;
    if (!o || !n1) { $('#spwmsg').textContent = '请填写完整'; return; }
    if (n1 !== n2) { $('#spwmsg').textContent = '两次输入的新口令不一致'; return; }
    const j = await rpc('change_student_password', { p_cls: CLS, p_old: o, p_new: n1 });
    $('#spwmsg').textContent = j.ok ? '' : (j.msg || '更新失败');
    if (j.ok) { sessionStorage.setItem('spwd', n1); $('#sold').value = $('#snew1').value = $('#snew2').value = ''; showToast('个人口令已更新'); }
  };
  $('#submit').onclick = async () => {
    if (STD) {
      if (scores.some(s => !s)) { $('#msg').textContent = '尚有项目未评分，请完成全部'; return; }
    } else {
      if (scores.some(s => !s || s < 0 || s > 100)) { $('#msg').textContent = '请为每项填写 0-100 的分数'; return; }
    }
    $('#submit').disabled = true;
    const j = await rpc('submit_vote', {
      p_client_id: cid, p_role: 'student', p_cls: CLS, p_grp: cur, p_subgrp: sub,
      p_scores: scores, p_form: '', p_anonymous: $('#anon').checked,
      p_name: $('#name').value, p_comment: $('#comment').value,
      p_code: sessionStorage.getItem('code'), p_pwd: sessionStorage.getItem('spwd'),
    });
    $('#submit').disabled = false;
    $('#msg').textContent = j.ok ? '评分已提交' : (j.msg || j.message || '提交失败，请检查网络');
    if (j.ok) showToast('评分已提交');
    if (j.ok) {
      voted[key()] = { scores: scores.slice(), anonymous: $('#anon').checked, name: $('#name').value, comment: $('#comment').value };
      localStorage.setItem('voted', JSON.stringify(voted));
      renderSubGroups();
    }
  };
}
init();
</script>
</body>
</html>
