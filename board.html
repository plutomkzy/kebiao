<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>实时大屏 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap board">
  <div class="panel">
    <!-- 大屏入口验证 -->
    <div id="gate">
      <div class="head">
        <span class="seal">榜</span>
        <h1>实时大屏</h1>
        <div class="sub">输入班级码查看本班大屏（教师口令可切换班级）</div>
      </div>
      <input type="password" id="pw" placeholder="班级码 / 教师口令" style="text-align:center;letter-spacing:4px">
      <button class="btn primary" id="go" style="margin-top:12px">进入大屏</button>
      <div id="msg"></div>
    </div>

    <div id="dash" style="display:none">
    <div class="head">
      <span class="seal">榜</span>
      <h1 id="title">实时得分</h1>
      <div class="sub" id="clock">--</div>
    </div>

    <div class="groups" id="clstabs"></div>

    <div class="note">点击任意行可聚焦该小组</div>

    <div class="tblwrap">
      <table id="tbl"><thead></thead><tbody></tbody></table>
    </div>

    <div class="extras" id="comments"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
let CLS = C.CLASS_IDS[0];
let BOARD_ROLE = 'student';
let allVotes = [], focusKey = null;

function renderClsTabs() {
  if (BOARD_ROLE === 'student') { $('#clstabs').style.display = 'none'; return; }
  $('#clstabs').style.display = '';
  const box = $('#clstabs');
  box.innerHTML = '';
  C.CLASS_IDS.forEach(id => {
    const b = document.createElement('button');
    b.className = 'gchip' + (id === CLS ? ' on' : '');
    b.textContent = cfgOf(id).name;
    b.onclick = () => { CLS = id; refresh(); };
    box.appendChild(b);
  });
}
async function refresh() {
  const cfg = cfgOf(CLS);
  renderClsTabs();
  allVotes = await loadVotes();
  const now = new Date();
  const clsVotes = allVotes.filter(v => v.cls === CLS);
  $('#title').textContent = cfg.name + ' · 实时得分';
  $('#clock').textContent = '更新于 ' + now.toLocaleTimeString('zh-CN', { hour12: false }) + ' · ' + cfg.name + '共 ' + clsVotes.length + ' 票';
  const rows = calcStats(allVotes, CLS);
  const std = cfg.mode === 'standard';
  $('#tbl thead').innerHTML = std
    ? '<tr><th>名次</th><th>组别</th><th>学生票数</th><th>学生均分</th><th>教师分</th><th>加权总分</th></tr>'
    : '<tr><th>名次</th><th>组别</th><th>学生票数</th><th>学生均分</th><th>教师讲课</th><th>教学设计</th><th>最终得分</th></tr>';
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    if (focusKey === uid(CLS, r.g, r.s)) tr.className = 'fg';
    const rank = r.final != null && i === 0 ? '<span class="rank g">1</span>'
      : (r.final == null ? '—'
        : '<span class="rank ' + (i === 1 ? 's' : i === 2 ? 'b' : '') + '">' + (i + 1) + '</span>');
    const pctbar = r.student_pct != null
      ? '<div class="pct"><i style="width:' + r.student_pct + '%"></i></div>' : '';
    let cells;
    if (std) {
      cells = '<td>' + (r.student_pct != null ? r.student_pct : '—') + pctbar + '</td>' +
        '<td>' + (r.teacher_pct != null ? r.teacher_pct : '待评') + '</td>' +
        '<td>' + (r.final != null ? '<b>' + r.final + '</b>' : '待教师打分') +
        ((r.pA_fin != null && r.pB_fin != null)
          ? '<div style="font-size:12.5px;color:#5c451f">A ' + r.pA_fin + ' · B ' + r.pB_fin + '</div>' : '') + '</td>';
    } else {
      cells = '<td>' + (r.student_pct != null ? r.student_pct : '—') + pctbar + '</td>' +
        '<td>' + (r.tL != null ? r.tL : '待评') + '</td>' +
        '<td>' + (r.tD != null ? r.tD : '待评') + '</td>' +
        '<td>' + (r.final != null ? '<b>' + r.final + '</b>' : '待出分') + '</td>';
    }
    tr.innerHTML =
      '<td>' + rank + '</td><td><b>第' + r.g + '大组·第' + r.s + '小组</b></td>' +
      '<td>' + r.sv + '</td>' + cells;
    tr.onclick = () => { focusKey = (focusKey === uid(CLS, r.g, r.s)) ? null : uid(CLS, r.g, r.s); refresh(); };
    tb.appendChild(tr);
  });

  const cbox = $('#comments');
  cbox.innerHTML = '';
  rows.forEach(r => {
    if (!r.comments.length) return;
    const box = document.createElement('div');
    box.className = 'comment-box';
    box.innerHTML = '<h3>第' + r.g + '大组·第' + r.s + '小组 · 评语（' + r.comments.length + '条）</h3>';
    const ul = document.createElement('ul');
    r.comments.forEach(c => {
      const li = document.createElement('li');
      const who = document.createElement('span');
      who.className = 'who' + (c.role === 'teacher' ? ' t' : '');
      who.textContent = (c.role === 'teacher' ? '师·' : '') + c.who;
      li.appendChild(who);
      li.appendChild(document.createTextNode(c.text));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    cbox.appendChild(box);
  });
}
function start() { refresh(); setInterval(refresh, 3000); }
function resume() {
  BOARD_ROLE = sessionStorage.getItem('boardRole') || 'student';
  CLS = sessionStorage.getItem('boardCls') || C.CLASS_IDS[0];
  $('#gate').style.display = 'none';
  $('#dash').style.display = 'block';
  start();
}
$('#go').onclick = async () => {
  const j = await enter($('#pw').value);
  if (!j.ok) { $('#msg').textContent = j.msg || '验证失败'; return; }
  if (j.role === 'student') { BOARD_ROLE = 'student'; CLS = j.cls; }
  else { BOARD_ROLE = j.role; CLS = C.CLASS_IDS[0]; }
  sessionStorage.setItem('boardRole', BOARD_ROLE);
  sessionStorage.setItem('boardCls', CLS);
  $('#gate').style.display = 'none';
  $('#dash').style.display = 'block';
  start();
};
if (sessionStorage.getItem('boardRole')) resume();
</script>
</body>
</html>
