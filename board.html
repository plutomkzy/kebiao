<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>实时汇总 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap board">
  <div class="panel">
    <div class="head">
      <span class="seal">榜</span>
      <h1>小组讲解 · 实时得分</h1>
      <div class="sub" id="clock">--</div>
    </div>

    <div style="text-align:center">
      <button class="btn small" id="focusBtn">大屏模式</button>
      <button class="btn small" id="csvBtn">导出数据</button>
      <button class="btn small ghost" id="resetBtn">清空数据</button>
    </div>
    <div class="note">点击任意行可聚焦该组</div>

    <div class="tblwrap">
      <table id="tbl">
        <thead>
          <tr><th>名次</th><th>组别</th><th>学生票数</th><th>学生均分</th><th>教师分</th><th>加权总分</th><th>星级</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="extras" id="comments"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const CFG = window.APP_CONFIG;
let allVotes = [], focusGrp = null;

async function rpc(fn, body) {
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: CFG.SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body),
  });
  return r.json();
}
async function loadVotes() {
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/votes?select=*&order=ts.asc', {
    headers: { apikey: CFG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY },
  });
  if (!r.ok) return [];
  return r.json();
}
function calc(votes) {
  const gs = {};
  for (let g = 1; g <= CFG.GROUP_COUNT; g++) {
    gs[g] = { g, sv: 0, ss: 0, tv: 0, ts: 0, comments: [] };
  }
  votes.forEach(v => {
    const d = gs[v.grp];
    if (!d) return;
    const pct = v.scores.reduce((a, b) => a + b, 0) * 2;
    if (v.role === 'student') { d.sv++; d.ss += pct; }
    else { d.tv++; d.ts += pct; }
    if (v.comment && v.comment.trim()) {
      d.comments.push({ who: v.anonymous ? '匿名' : (v.name || '匿名'), role: v.role, text: v.comment.trim() });
    }
  });
  const rows = Object.values(gs).map(d => {
    d.student_pct = d.sv ? Math.round(d.ss / d.sv * 10) / 10 : null;
    d.teacher_pct = d.tv ? Math.round(d.ts / d.tv * 10) / 10 : null;
    d.weighted = (d.student_pct != null && d.teacher_pct != null)
      ? Math.round((d.student_pct * CFG.STUDENT_WEIGHT + d.teacher_pct * CFG.TEACHER_WEIGHT) * 10) / 10 : null;
    return d;
  });
  rows.sort((a, b) => {
    if (a.weighted != null && b.weighted != null) return b.weighted - a.weighted;
    if (a.weighted != null) return -1;
    if (b.weighted != null) return 1;
    return (b.student_pct || 0) - (a.student_pct || 0);
  });
  return rows;
}
async function refresh() {
  allVotes = await loadVotes();
  const now = new Date();
  $('#clock').textContent = '更新于 ' + now.toLocaleTimeString('zh-CN', { hour12: false }) + ' · 共 ' + allVotes.length + ' 票';
  const rows = calc(allVotes);
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    if (focusGrp === r.g) tr.className = 'fg';
    const rank = r.weighted != null && i === 0 ? '<span class="rank g">1</span>'
               : (r.weighted === null ? '—'
                 : '<span class="rank ' + (i === 1 ? 's' : i === 2 ? 'b' : '') + '">' + (i + 1) + '</span>');
    const teacher = r.teacher_pct != null
      ? r.teacher_pct + '<div style="font-size:14px;color:#5c451f">' + r.tv + '票</div>'
      : '待评';
    const weighted = r.weighted != null ? '<b>' + r.weighted + '</b>' : '待教师打分';
    const star = r.student_pct != null ? (r.student_pct / 20).toFixed(1) + '星' : '—';
    const pctbar = r.student_pct != null
      ? '<div class="pct"><i style="width:' + r.student_pct + '%"></i></div>' : '';
    tr.innerHTML =
      '<td>' + rank + '</td><td><b>第' + r.g + '组</b></td>' +
      '<td>' + r.sv + '</td>' +
      '<td>' + (r.student_pct != null ? r.student_pct : '—') + pctbar + '</td>' +
      '<td>' + teacher + '</td>' +
      '<td>' + weighted + '</td>' +
      '<td>' + star + '</td>';
    tr.onclick = () => { focusGrp = (focusGrp === r.g) ? null : r.g; refresh(); };
    tb.appendChild(tr);
  });

  const cbox = $('#comments');
  cbox.innerHTML = '';
  rows.forEach(r => {
    if (!r.comments.length) return;
    const box = document.createElement('div');
    box.className = 'comment-box';
    box.innerHTML = '<h3>第' + r.g + '组 · 评语（' + r.comments.length + '条）</h3>';
    const ul = document.createElement('ul');
    r.comments.forEach(c => {
      const li = document.createElement('li');
      const who = document.createElement('span');
      who.className = 'who' + (c.role === 'teacher' ? ' t' : '');
      who.textContent = (c.role === 'teacher' ? '师·' : '') + c.who;
      li.appendChild(who);
      li.appendChild(document.createTextNode(c.text));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    cbox.appendChild(box);
  });
}
function exportCsv() {
  const lines = ['组别,角色,匿名,姓名,评语,'
    + CFG.ITEMS.map((_, i) => '第' + (i + 1) + '项').join(',') + ',总分(百分)'];
  allVotes.forEach(v => {
    const pct = v.scores.reduce((a, b) => a + b, 0) * 2;
    lines.push([
      v.grp, v.role === 'teacher' ? '教师' : '学生', v.anonymous ? '是' : '否',
      v.anonymous ? '' : (v.name || ''), (v.comment || '').replace(/,/g, '，').replace(/\n/g, ' '),
      ...v.scores, pct,
    ].join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'scores.csv';
  a.click();
}
async function init() {
  refresh();
  setInterval(refresh, 3000);
  $('#focusBtn').onclick = () => {
    document.body.classList.toggle('focus');
    $('#focusBtn').textContent = document.body.classList.contains('focus') ? '退出大屏' : '大屏模式';
  };
  $('#csvBtn').onclick = exportCsv;
  $('#resetBtn').onclick = async () => {
    const pw = prompt('清空全部评分数据？请输入教师口令确认：');
    if (!pw) return;
    const j = await rpc('reset_votes', { p_password: pw });
    alert(j.ok ? j.msg : (j.msg || j.message || '操作失败'));
    refresh();
  };
}
init();
</script>
</body>
</html>
