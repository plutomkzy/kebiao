<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>学生入口 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="panel">
    <!-- 第一步：班级码 -->
    <div id="step1">
      <div class="head">
        <span class="seal">生</span>
        <h1>学生入口</h1>
        <div class="sub">第一步：输入本班班级码</div>
      </div>
      <input type="password" id="pw" placeholder="班级码" style="text-align:center;letter-spacing:6px">
      <button class="btn primary" id="go1" style="margin-top:12px">下一步</button>
      <div id="msg"></div>
    </div>

    <!-- 第二步：学号 -->
    <div id="step2" style="display:none">
      <div class="head">
        <span class="seal">生</span>
        <h1 id="t2">学生入口</h1>
        <div class="sub">第二步：输入学号和个人口令（首次使用：口令=学号）</div>
      </div>
      <input type="text" id="code" placeholder="学号" style="text-align:center;letter-spacing:4px">
      <input type="password" id="spwd" placeholder="个人口令" style="text-align:center;letter-spacing:4px;margin-top:8px">
      <button class="btn primary" id="go2" style="margin-top:12px">进入评分</button>
      <div id="msg2"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
async function init() {
  $('#go1').onclick = async () => {
    const pw = $('#pw').value;
    if (!pw) { $('#msg').textContent = '请输入班级码'; return; }
    const j = await enter(pw);
    if (!j.ok) { $('#msg').textContent = j.msg || '验证失败，请重试'; return; }
    if (j.role !== 'student') { $('#msg').textContent = '该密钥不是学生班级码，请从对应入口进入'; return; }
    sessionStorage.setItem('cls', j.cls);
    $('#t2').textContent = cfgOf(j.cls).name + ' · 学生入口';
    $('#step1').style.display = 'none';
    $('#step2').style.display = 'block';
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go1').click(); };
  $('#go2').onclick = async () => {
    const code = $('#code').value.trim();
    const spwd = $('#spwd').value;
    if (!code) { $('#msg2').textContent = '请输入学号'; return; }
    if (!spwd) { $('#msg2').textContent = '请输入个人口令'; return; }
    const j = await rpc('verify_student', { p_cls: sessionStorage.getItem('cls'), p_code: code, p_pwd: spwd });
    if (!j.ok) { $('#msg2').textContent = j.msg || '验证失败'; return; }
    sessionStorage.setItem('role', 'student');
    sessionStorage.setItem('code', code);
    sessionStorage.setItem('spwd', spwd);
    sessionStorage.setItem('sname', j.name || '');
    location.href = 'vote.html';
  };
  $('#code').onkeydown = e => { if (e.key === 'Enter') $('#go2').click(); };
}
init();
</script>
</body>
</html>
