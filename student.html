<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>学生入口 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
<style>
  .remember{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:12px;
    font-size:15px;color:#5c451f;cursor:pointer;user-select:none}
  .remember input{width:22px;height:22px;margin:0;cursor:pointer}
  #autoBar{display:none;margin-bottom:14px;padding:12px;border:2px solid #d9c8a0;border-radius:10px;
    background:#fbf3dd;font-size:14.5px;color:#6b5730;text-align:center;line-height:1.7}
  #autoBar b{color:#b03a2e}
  #autoBar .btns{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .spin{display:inline-block;width:13px;height:13px;margin-right:6px;vertical-align:-1px;
    border:3px solid #e2d3ab;border-top-color:#b03a2e;border-radius:50%;animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">

    <div id="autoBar"></div>

    <!-- 第一步：选班级 -->
    <div id="step1">
      <div class="head">
        <span class="seal">生</span>
        <h1>学生入口</h1>
        <div class="sub">输入班级码</div>
      </div>
      <input type="password" id="pw" placeholder="班级码" inputmode="numeric" autocomplete="off"
        style="text-align:center;letter-spacing:6px">
      <button class="btn primary" id="go1" style="margin-top:12px">下一步</button>
      <div id="msg"></div>
    </div>

    <!-- 第二步：口令（只有在需要时才出现） -->
    <div id="step2" style="display:none">
      <div class="head">
        <span class="seal">生</span>
        <h1 id="t2">学生入口</h1>
        <div class="sub" id="sub2">输入口令（首次使用＝学号）</div>
      </div>
      <div style="display:flex;gap:8px;align-items:stretch">
        <input type="password" id="spwd" placeholder="口令" autocomplete="off" autocapitalize="off"
          autocorrect="off" spellcheck="false" style="text-align:center;letter-spacing:2px">
        <button class="btn small" id="eye" title="显示/隐藏口令"
          style="padding:0 14px;margin:0;font-size:18px">👁</button>
      </div>
      <label class="remember"><input type="checkbox" id="remember" checked>记住我，下次自动登录</label>
      <button class="btn primary" id="go2" style="margin-top:12px">进入</button>
      <div id="msg2"></div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn small" id="back1" style="font-size:14px;padding:8px 16px">← 重新选班级</button>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
const AUTO_KEY = 'kb_auto';     // 勾了"记住我"才写：{cls, app, code, spwd, name}

/* ---------- 带超时与重试的请求 ---------- */
async function call(fn, body, tries) {
  const n = tries || 3;
  let lastErr = '';
  for (let i = 0; i < n; i++) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch(C.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: C.SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY
        },
        body: JSON.stringify(body),
        signal: ctl.signal
      });
      clearTimeout(timer);
      if (!r.ok) { lastErr = 'HTTP ' + r.status; }
      else {
        const j = await r.json();
        if (j && typeof j === 'object') return j;
        lastErr = '返回格式异常';
      }
    } catch (e) {
      lastErr = (e && e.name === 'AbortError') ? '请求超时' : String((e && e.message) || e);
    }
    if (i < n - 1) await new Promise(res => setTimeout(res, 700 + i * 1200));
  }
  return { ok: false, net: true, msg: '连不上服务器（' + lastErr + '），请检查网络后重试' };
}

/* ---------- 记录 ---------- */
function saveAuto(o) { try { localStorage.setItem(AUTO_KEY, JSON.stringify(o)); } catch (e) { } }
function clearAuto() { try { localStorage.removeItem(AUTO_KEY); } catch (e) { } }
function readAuto() { try { const s = localStorage.getItem(AUTO_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }

function setSession(cls, app, code, spwd, name) {
  sessionStorage.setItem('cls', cls);
  sessionStorage.setItem('app', app || 'score');
  sessionStorage.setItem('role', 'student');
  sessionStorage.setItem('code', code);
  sessionStorage.setItem('spwd', spwd);
  sessionStorage.setItem('sname', name || '');
}
function goApp(app) { location.href = (app === 'team') ? 'team.html' : 'vote.html'; }

/* 当前设备上已知的身份口令：优先本次会话，其次"记住我" */
function knownPwd() {
  const s = sessionStorage.getItem('spwd');
  if (s) return s;
  const a = readAuto();
  return (a && a.spwd) ? a.spwd : '';
}
function knownName() {
  return sessionStorage.getItem('sname') || (readAuto() || {}).name || '';
}
function appName(app) { return app === 'team' ? '组队系统' : '打分系统'; }
function clsName(cls, app) {
  if (app === 'team') return '组队';
  try { return (cfgOf(cls) || {}).name || (cls + '班'); } catch (e) { return cls + '班'; }
}

function busy(btn, on, text) {
  if (!btn) return;
  if (on) {
    btn.dataset.old = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>' + (text || '处理中…');
  } else {
    btn.disabled = false;
    btn.textContent = btn.dataset.old || btn.textContent;
  }
}

/* ---------- 用已记住的身份直接进入 ---------- */
async function enterWithKnown(cls, app, btn) {
  const pwd = knownPwd();
  if (!pwd) return false;
  if (btn) busy(btn, true, '进入中…');
  const j = await call('verify_student_pwd', { p_cls: cls, p_pwd: pwd });
  if (btn) busy(btn, false);
  if (j && j.ok) {
    setSession(cls, app, j.code, pwd, j.name || knownName());
    const a = readAuto();
    if (a) saveAuto(Object.assign({}, a, { cls: cls, app: app, code: j.code, spwd: pwd, name: j.name || a.name }));
    return true;
  }
  if (j && j.net) { $('#msg').textContent = j.msg; return 'net'; }
  clearAuto();                       // 口令变了：清掉记住的信息，要求重输
  sessionStorage.removeItem('spwd');
  return false;
}

function init() {
  $('#step1').style.display = 'block';     // 表单永远立即可用，不挡着

  /* ---- 顶部提示条：上次的班级 + 可换班级 ---- */
  const auto = readAuto();
  const bar = $('#autoBar');
  if (auto && auto.cls) {
    // 不自动跳转，停在选班级界面
    bar.style.display = 'block';
    bar.innerHTML = '上次你进的是 <b>' + clsName(auto.cls, auto.app) + ' · ' + appName(auto.app) + '</b>' +
      (auto.name ? '（' + auto.name + '）' : '') +
      '<div class="btns"><button class="btn small" id="autoGo">直接进入上次的</button>' +
      '<button class="btn small" id="autoChange" style="background:#f0e2bd;color:#6b5730">换个班级</button></div>';
    $('#autoGo').onclick = () => {
      busy($('#autoGo'), true, '进入中…');
      goApp(auto.app);
    };
    $('#autoChange').onclick = () => { bar.style.display = 'none'; $('#pw').focus(); };
  }

  /* ---- 第一步：选班级 ---- */
  $('#go1').onclick = async () => {
    const pw = $('#pw').value.trim();
    if (!pw) { $('#msg').textContent = '请输入班级码'; return; }
    $('#msg').textContent = '';
    busy($('#go1'), true, '验证中…');
    const j = await call('enter', { p_password: pw });
    busy($('#go1'), false);
    if (!j.ok) { $('#msg').textContent = j.msg || '验证失败，请重试'; return; }
    if (j.role !== 'student') { $('#msg').textContent = '该密钥不是学生班级码，请从对应入口进入'; return; }
    const app = j.app || 'score';
    sessionStorage.setItem('cls', j.cls);
    sessionStorage.setItem('app', app);
    bar.style.display = 'none';

    // 已记住身份 → 直接进，不再问口令
    if (knownPwd()) {
      const r = await enterWithKnown(j.cls, app, $('#go1'));
      if (r === true) { goApp(app); return; }
      if (r === 'net') return;                 // 网络问题，已提示
      $('#msg').textContent = '口令对不上了（可能改过），请重新输一次';
    }
    $('#t2').textContent = clsName(j.cls, app) + ' · 学生入口';

    $('#step1').style.display = 'none';
    $('#step2').style.display = 'block';
    const s2 = $('#spwd'); if (s2) s2.focus();
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go1').click(); };

  /* ---- 第二步：口令 ---- */
  $('#go2').onclick = async () => {
    const spwd = $('#spwd').value.trim();
    if (!spwd) { $('#msg2').textContent = '请输入口令'; return; }
    const cls = sessionStorage.getItem('cls');
    const app = sessionStorage.getItem('app') || 'score';
    busy($('#go2'), true, '登录中…');
    $('#msg2').textContent = '';
    const j = await call('verify_student_pwd', { p_cls: cls, p_pwd: spwd });
    busy($('#go2'), false);
    if (!j.ok) { $('#msg2').textContent = j.msg || '验证失败'; return; }
    setSession(cls, app, j.code, spwd, j.name);
    if ($('#remember').checked) saveAuto({ cls: cls, app: app, code: j.code, spwd: spwd, name: j.name || '' });
    else clearAuto();
    goApp(app);
  };
  $('#spwd').onkeydown = e => { if (e.key === 'Enter') $('#go2').click(); };

  $('#eye').onclick = () => {
    const i = $('#spwd');
    i.type = (i.type === 'password') ? 'text' : 'password';
    $('#eye').style.opacity = (i.type === 'text') ? '1' : '.75';
    i.focus();
  };

  $('#back1').onclick = () => {
    $('#step2').style.display = 'none';
    $('#step1').style.display = 'block';
    $('#msg2').textContent = '';
    const p = $('#pw'); if (p) p.focus();
  };
}
init();
</script>
</body>
</html>
