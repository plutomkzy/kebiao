<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>管理后台 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap board">
  <div class="panel">
    <!-- 登录 -->
    <div id="login">
      <div class="head">
        <span class="seal">管</span>
        <h1>管理后台</h1>
        <div class="sub">评分明细 · 成绩单 · 数据导出</div>
      </div>
      <input type="password" id="pw" placeholder="管理员口令" style="text-align:center;letter-spacing:4px">
      <button class="btn primary" id="go" style="margin-top:12px">进入后台</button>
      <div id="msg"></div>
    </div>

    <!-- 后台 -->
    <div id="dash" style="display:none">
      <div class="head">
        <span class="seal">管</span>
        <h1>管理后台 <span class="badge">仅管理员</span></h1>
        <div class="sub" id="clock">--</div>
      </div>

      <div class="groups" id="clstabs"></div>
      <div class="statchips" id="chips"></div>

      <details class="keys">
        <summary>密钥管理</summary>
        <div class="fblock">
          <h3>修改管理员口令</h3>
          <input type="password" id="ao" placeholder="原口令">
          <input type="password" id="an1" placeholder="新口令">
          <input type="password" id="an2" placeholder="确认新口令">
          <button class="btn small" id="btnA">更新</button>
        </div>
        <div class="fblock">
          <h3>修改教师口令</h3>
          <input type="password" id="apw" placeholder="管理员口令">
          <input type="password" id="tn" placeholder="新教师口令">
          <button class="btn small" id="btnT">更新</button>
        </div>
        <div class="fblock">
          <h3>修改班级码</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select id="selCls" style="padding:10px;border:2px solid var(--line);border-radius:10px;background:rgba(255,250,235,.8);font-family:inherit;font-size:16px">
              <option value="3">3班</option><option value="4">4班</option><option value="5">5班</option>
            </select>
            <input type="password" id="cpw" placeholder="管理员口令" style="flex:1;min-width:140px">
            <input type="text" id="cnew" placeholder="新班级码" style="flex:1;min-width:140px">
            <button class="btn small" id="btnC">更新</button>
          </div>
        </div>
      </details>

      <div style="text-align:center">
        <button class="btn small primary" id="reportBtn">生成成绩单</button>
        <button class="btn small" id="copyBtn">复制成绩单</button>
        <button class="btn small" id="printBtn">打印成绩单</button>
        <button class="btn small" id="csvBtn">导出数据</button>
        <button class="btn small ghost" id="resetBtn">清空当前班数据</button>
      </div>

      <div class="tblwrap">
        <table id="tbl"><thead></thead><tbody></tbody></table>
      </div>

      <div class="report print-area" id="report" style="display:none">
        <h2 id="rptTitle">成绩单</h2>
        <div id="reportBody"></div>
        <div class="rdate" id="reportDate"></div>
      </div>

      <div id="details"></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
let CLS = C.CLASS_IDS[0];
let allVotes = [];
const openSet = new Set();

function renderClsTabs() {
  const box = $('#clstabs');
  box.innerHTML = '';
  C.CLASS_IDS.forEach(id => {
    const b = document.createElement('button');
    b.className = 'gchip' + (id === CLS ? ' on' : '');
    b.textContent = cfgOf(id).name;
    b.onclick = () => { CLS = id; refresh(); };
    box.appendChild(b);
  });
}
async function refresh() {
  const cfg = cfgOf(CLS);
  renderClsTabs();
  allVotes = await loadVotes();
  const clsVotes = allVotes.filter(v => v.cls === CLS);
  const st = clsVotes.filter(v => v.role === 'student').length;
  const tn = clsVotes.filter(v => v.role === 'teacher').length;
  const units = unitList(CLS).length;
  const rows = calcStats(allVotes, CLS);
  const done = rows.filter(r => r.final != null).length;
  $('#clock').textContent = '当前：' + cfg.name + ' · 更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }) + ' · 共 ' + clsVotes.length + ' 票';
  $('#chips').innerHTML =
    '<span class="chip">总票数 <b>' + clsVotes.length + '</b></span>' +
    '<span class="chip">学生票 <b>' + st + '</b></span>' +
    '<span class="chip">教师票 <b>' + tn + '</b></span>' +
    '<span class="chip">已出分 <b>' + done + '</b> / ' + units + ' 组</span>';

  const std = cfg.mode === 'standard';
  $('#tbl thead').innerHTML = std
    ? '<tr><th>组别</th><th>学生票</th><th>学生均分</th><th>教师分</th><th>加权总分</th><th>排名</th><th>明细</th></tr>'
    : '<tr><th>组别</th><th>学生票</th><th>学生均分</th><th>教师讲课</th><th>教学设计</th><th>最终得分</th><th>排名</th><th>明细</th></tr>';
  const tb = $('#tbl tbody');
  tb.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const rank = r.final != null
      ? '<span class="rank ' + (i === 0 ? 'g' : i === 1 ? 's' : i === 2 ? 'b' : '') + '">' + (i + 1) + '</span>'
      : '—';
    const pctbar = r.student_pct != null ? '<div class="pct"><i style="width:' + r.student_pct + '%"></i></div>' : '';
    let cells;
    if (std) {
      cells = '<td>' + (r.student_pct != null ? r.student_pct : '—') + pctbar + '</td>' +
        '<td>' + (r.teacher_pct != null ? r.teacher_pct + '（' + r.tv + '票）' : '待评') + '</td>' +
        '<td>' + (r.final != null ? '<b>' + r.final + '</b>' : '待教师打分') + '</td>';
    } else {
      cells = '<td>' + (r.student_pct != null ? r.student_pct : '—') + pctbar + '</td>' +
        '<td>' + (r.tL != null ? r.tL : '待评') + '</td>' +
        '<td>' + (r.tD != null ? r.tD : '待评') + '</td>' +
        '<td>' + (r.final != null ? '<b>' + r.final + '</b>' : '待出分') + '</td>';
    }
    tr.innerHTML =
      '<td><b>第' + r.g + '大组·第' + r.s + '小组</b></td><td>' + r.sv + '</td>' + cells +
      '<td>' + rank + '</td>' +
      '<td><button class="dbtn">' + (r.votes.length ? '展开' : '无') + '</button></td>';
    tb.appendChild(tr);
    const key = uid(CLS, r.g, r.s);
    if (openSet.has(key)) {
      expandDetail(tr, r);
      tr.querySelector('.dbtn').textContent = '收起';
    }
    tr.querySelector('.dbtn').onclick = () => { toggleDetail(tr, r); };
  });
}
function roleLabel(v) {
  if (v.role === 'student') return '生·';
  return v.form === 'lecture' ? '师·讲课' : v.form === 'design' ? '师·设计' : '师·';
}
function toggleDetail(tr, r) {
  const key = uid(CLS, r.g, r.s);
  if (openSet.has(key)) {
    openSet.delete(key);
    let n = tr.nextElementSibling;
    while (n && n.classList.contains('dvote')) {
      const x = n;
      n = n.nextElementSibling;
      x.remove();
    }
    tr.querySelector('.dbtn').textContent = '展开';
    return;
  }
  openSet.add(key);
  expandDetail(tr, r);
  tr.querySelector('.dbtn').textContent = '收起';
}
function expandDetail(tr, r) {
  r.votes.slice().reverse().forEach(v => {
    const d = document.createElement('div');
    d.className = 'dvote' + (v.role === 'teacher' ? ' teacher' : '');
    d.innerHTML =
      '<span class="t">' + fmtTime(v.ts) + '</span>' +
      roleLabel(v) + (v.anonymous ? '匿名' : (v.name || '匿名')) +
      '<span class="sc">' + v.scores.join(' ') + '</span>' +
      (v.comment ? '<br><span class="cm">评语：' + esc(v.comment) + '</span>' : '');
    tr.after(d);
  });
}
async function buildReport() {
  const cfg = cfgOf(CLS);
  const rows = calcStats(allVotes, CLS);
  $('#rptTitle').textContent = cfg.name + ' · 成绩单';
  let n = 0;
  const doneLines = [], undLines = [];
  rows.forEach(r => {
    if (r.final == null) {
      if (r.sv || r.tv || r.tLCount || r.tDCount) {
        undLines.push('<div class="rline">第' + r.g + '大组·第' + r.s + '小组 —— 部分评分未完成，暂无法出分</div>');
      }
      return;
    }
    n++;
    doneLines.push('<div class="rline">' + (cfg.mode === 'standard'
      ? '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 <b>' + r.student_pct + '</b> · 教师分 <b>' + r.teacher_pct + '</b> · 加权总分 <b>' + r.final + '</b>（第' + n + '名）'
      : '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 <b>' + r.student_pct + '</b> · 教师讲课 <b>' + r.tL + '</b> · 教学设计 <b>' + r.tD + '</b> · 最终得分 <b>' + r.final + '</b>（第' + n + '名）') + '</div>');
  });
  $('#reportBody').innerHTML = doneLines.join('') + undLines.join('');
  $('#reportDate').textContent = '统计时间：' + fmtTime(new Date().toISOString());
  $('#report').style.display = 'block';
  $('#report').scrollIntoView({ behavior: 'smooth' });
}
function reportText() {
  const cfg = cfgOf(CLS);
  const rows = calcStats(allVotes, CLS);
  const lines = [cfg.name + ' · 成绩单', ''];
  let n = 0;
  rows.forEach(r => {
    if (r.final == null) return;
    n++;
    lines.push(cfg.mode === 'standard'
      ? '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 ' + r.student_pct + ' · 教师分 ' + r.teacher_pct + ' · 加权总分 ' + r.final + '（第' + n + '名）'
      : '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 ' + r.student_pct + ' · 教师讲课 ' + r.tL + ' · 教学设计 ' + r.tD + ' · 最终得分 ' + r.final + '（第' + n + '名）');
  });
  lines.push('', '统计时间：' + fmtTime(new Date().toISOString()));
  return lines.join('\n');
}
function exportCsv() {
  const cfg = cfgOf(CLS);
  const maxItems = Math.max(...allVotes.map(v => v.scores.length), 1);
  const lines = ['班级,大组,小组,角色,表单,匿名,姓名,评语,'
    + Array.from({ length: maxItems }, (_, i) => '第' + (i + 1) + '项').join(',') + ',合计'];
  allVotes.filter(v => v.cls === CLS).forEach(v => {
    lines.push([
      CLS, v.grp, v.subgrp || 1,
      v.role === 'student' ? '学生' : (v.form === 'lecture' ? '教师·讲课' : v.form === 'design' ? '教师·设计' : '教师'),
      v.form || '', v.anonymous ? '是' : '否', v.anonymous ? '' : (v.name || ''),
      (v.comment || '').replace(/,/g, '，').replace(/\n/g, ' '),
      ...v.scores, v.scores.reduce((a, b) => a + b, 0),
    ].join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cfg.name + '数据.csv';
  a.click();
}
async function init() {
  if (sessionStorage.getItem('role') === 'admin') { $('#login').style.display = 'none'; $('#dash').style.display = 'block'; refresh(); setInterval(refresh, 5000); }
  $('#go').onclick = async () => {
    const j = await rpc('verify_admin', { p_password: $('#pw').value });
    if (!j.ok) { $('#msg').textContent = j.msg || '验证失败'; return; }
    sessionStorage.setItem('role', 'admin');
    $('#login').style.display = 'none'; $('#dash').style.display = 'block';
    refresh(); setInterval(refresh, 5000);
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
  $('#btnA').onclick = async () => {
    if ($('#an1').value !== $('#an2').value) { alert('两次输入的新口令不一致'); return; }
    const j = await rpc('change_admin_password', { p_old: $('#ao').value, p_new: $('#an1').value });
    if (j.ok) { $('#ao').value = $('#an1').value = $('#an2').value = ''; $('#pw').value = ''; showToast('管理员口令已更新'); }
    else alert(j.msg || '更新失败');
  };
  $('#btnT').onclick = async () => {
    const j = await rpc('admin_set_teacher_password', { p_admin_password: $('#apw').value, p_new: $('#tn').value });
    if (j.ok) { $('#apw').value = $('#tn').value = ''; showToast('教师口令已更新'); }
    else alert(j.msg || '更新失败');
  };
  $('#btnC').onclick = async () => {
    const j = await rpc('admin_set_student_code', { p_admin_password: $('#cpw').value, p_cls: $('#selCls').value, p_new: $('#cnew').value });
    if (j.ok) { $('#cpw').value = $('#cnew').value = ''; showToast('班级码已更新'); }
    else alert(j.msg || '更新失败');
  };
  $('#reportBtn').onclick = buildReport;
  $('#copyBtn').onclick = async () => { await navigator.clipboard.writeText(reportText()); alert('成绩单已复制'); };
  $('#printBtn').onclick = () => { buildReport().then(() => { document.body.classList.add('printing'); setTimeout(() => { window.print(); document.body.classList.remove('printing'); }, 100); }); };
  $('#csvBtn').onclick = exportCsv;
  $('#resetBtn').onclick = async () => {
    const pw = prompt('清空【' + cfgOf(CLS).name + '】的全部评分数据？请输入管理员口令确认：');
    if (!pw) return;
    const j = await rpc('admin_reset', { p_password: pw, p_cls: CLS });
    alert(j.ok ? j.msg : (j.msg || j.message || '操作失败'));
    refresh();
  };
}
init();
</script>
</body>
</html>
