<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241708">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b03a2e'/%3E%3Ctext x='32' y='43' font-size='34' text-anchor='middle' fill='%23f7ead0' font-family='serif'%3E%E8%AF%84%3C/text%3E%3C/svg%3E">
<title>教师评分 · 课标讲解评分系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="panel">
    <!-- 登录 -->
    <div id="login">
      <div class="head">
        <span class="seal">师</span>
        <h1>教师入口</h1>
        <div class="sub">输入教师口令 · 可切换 3 / 4 / 5 班</div>
      </div>
      <input type="password" id="pw" placeholder="教师口令" style="text-align:center;letter-spacing:4px">
      <button class="btn primary" id="go" style="margin-top:12px">进入</button>
      <div id="msg"></div>
    </div>

    <!-- 主界面 -->
    <div id="dash" style="display:none">
      <div class="head">
        <span class="seal">师</span>
        <h1 id="title">教师评分</h1>
        <div class="sub" id="sub"></div>
      </div>

      <div class="groups" id="clstabs"></div>
      <div class="groups" id="groups"></div>
      <div class="groups" id="subgroups"></div>

      <details class="keys">
        <summary>修改教师口令</summary>
        <div class="fblock">
          <input type="password" id="oldpw" placeholder="原口令">
          <input type="password" id="newpw1" placeholder="新口令">
          <input type="password" id="newpw2" placeholder="确认新口令">
          <button class="btn small" id="chpw" style="margin-top:8px">更新口令</button>
          <div id="pwmsg" style="text-align:center;color:var(--red);min-height:22px"></div>
        </div>
      </details>

      <div id="formArea"></div>

      <div id="tmsg"></div>

      <div style="text-align:center;margin-top:14px">
        <button class="btn small" id="reportBtn">查看成绩单</button>
        <button class="btn small" id="copyBtn" style="display:none">复制成绩单</button>
        <button class="btn small" id="printBtn" style="display:none">打印成绩单</button>
        <button class="btn small" id="csvBtn" style="display:none">导出成绩单CSV</button>
      </div>
      <div class="report print-area" id="report" style="display:none">
        <h2 id="rptTitle">成绩单</h2>
        <div id="reportBody"></div>
        <div class="rdate" id="reportDate"></div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = s => document.querySelector(s);
let CLS = C.CLASS_IDS[0];
const tcid = localStorage.getItem('tcid') || (() => { const v = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2); localStorage.setItem('tcid', v); return v; })();
let cur = 1, sub = 1, starScores = [], lecScores = [], desScores = [], tierVals = [null, null];

function curCfg() { return cfgOf(CLS); }

function renderClsTabs() {
  const box = $('#clstabs');
  box.innerHTML = '';
  C.CLASS_IDS.forEach(id => {
    const b = document.createElement('button');
    b.className = 'gchip' + (id === CLS ? ' on' : '');
    b.textContent = cfgOf(id).name;
    b.onclick = () => { CLS = id; renderAll(); };
    box.appendChild(b);
  });
}
function renderGroups() {
  const box = $('#groups');
  box.innerHTML = '';
  curCfg().groups.forEach((n, i) => {
    const g = i + 1;
    const b = document.createElement('button');
    b.className = 'gchip' + (g === cur ? ' on' : '');
    b.textContent = '第' + g + '大组';
    b.onclick = () => { cur = g; renderGroups(); renderSubGroups(); resetForms(); };
    box.appendChild(b);
  });
  renderSubGroups();
}
function renderSubGroups() {
  const box = $('#subgroups');
  box.innerHTML = '';
  for (let s = 1; s <= curCfg().groups[cur - 1]; s++) {
    const b = document.createElement('button');
    b.className = 'gchip' + (s === sub ? ' on' : '');
    b.textContent = '第' + s + '小组';
    b.onclick = () => { sub = s; renderSubGroups(); resetForms(); };
    box.appendChild(b);
  }
}
function resetForms() {
  starScores = []; lecScores = []; desScores = [];
  $('#formArea').innerHTML = '';
  $('#tmsg').textContent = '';
  renderForm();
}
function paintStars(el, val) {
  el.querySelectorAll('span').forEach((s, i) => s.classList.toggle('on', i < val));
}
/* 两人档位：教师对 2 人小组的两位成员分别评档 */
function tierBlockHTML(cfg) {
  const opts = cfg.tierOptions || [];
  if (!opts.length) return '';
  const labels = cfg.personLabels || ['成员A', '成员B'];
  let h = '<div class="fblock"><h3>个人档位（两位成员分别评定）</h3>';
  labels.forEach((nm, i) => {
    h += '<div class="formrow"><span class="fname">' + nm + '</span><span class="tierpick" data-i="' + i + '">';
    opts.forEach(o => {
      h += '<button class="tierbtn" data-i="' + i + '" data-v="' + o[1] + '">' + o[0] +
        '<small>' + o[1] + '</small></button>';
    });
    h += '</span></div>';
  });
  h += '<div class="ftotal" id="tierTip">未选档位时，两位成员按小组同分</div></div>';
  return h;
}
function wireTiers(cfg) {
  tierVals = [null, null];
  document.querySelectorAll('#formArea .tierbtn').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.i;
      tierVals[i] = +b.dataset.v;
      document.querySelectorAll('#formArea .tierbtn[data-i="' + i + '"]').forEach(x => x.classList.toggle('on', x === b));
      updateTierTip(cfg);
    };
  });
}
function updateTierTip(cfg) {
  const tip = $('#tierTip');
  if (!tip) return;
  if (!tierVals[0] || !tierVals[1]) {
    tip.textContent = '未选档位时，两位成员按小组同分';
    return;
  }
  const diff = Math.abs(tierVals[0] - tierVals[1]);
  const half = ((cfg.tiltK || 0) * diff / 2).toFixed(1);
  const buf = cfg.floorBuffer || 0;
  tip.innerHTML = '档位差 <b>' + diff + '</b> → 两人相对小组均分 <b>±' + half +
    '</b> 分；保底：成员A ≥ <b>' + (tierVals[0] - buf) + '</b>，成员B ≥ <b>' + (tierVals[1] - buf) + '</b>';
}
function renderForm() {
  const cfg = curCfg();
  $('#title').textContent = cfg.name + ' · 教师评分';
  $('#sub').textContent = cfg.mode === 'standard'
    ? '十项五星评整组；最下方为两位成员的个人档位，用于个人分倾斜与保底（学生占 70%，教师占 30%）'
    : '每对搭档：讲课评分表 + 教学设计评分表分别提交；最终 =（师讲课×40% + 生平均×60%）×60% + 教学设计×40%';
  const box = $('#formArea');
  if (cfg.mode === 'standard') {
    box.innerHTML = '';
    starScores = Array(cfg.items.length).fill(0);
    cfg.items.forEach((it, i) => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML =
        '<div class="ihead"><div><div class="iname"><span class="no">' + (i + 1) + '</span>' + it[0] + '</div>' +
        '<div class="ihint">' + it[1] + '</div></div>' +
        '<div class="stars">' + '<span>★</span>'.repeat(5) + '</div></div>';
      box.appendChild(div);
      const el = div.querySelector('.stars');
      el.querySelectorAll('span').forEach((sp, k) => {
        sp.onclick = () => { starScores[i] = k + 1; paintStars(el, starScores[i]); };
      });
    });
    box.insertAdjacentHTML('beforeend',
      '<textarea id="cm" placeholder="评语（选填）"></textarea>' +
      tierBlockHTML(cfg) +
      '<button class="btn primary" id="subStd" style="margin-top:16px">提交教师评分</button>');
    wireTiers(cfg);
    $('#subStd').onclick = async () => {
      if (starScores.some(s => !s)) { $('#tmsg').textContent = '尚有项目未评分，请完成全部'; return; }
      const tiers = (tierVals[0] && tierVals[1]) ? tierVals.slice() : null;
      $('#subStd').disabled = true;
      const j = await rpc('submit_vote', {
        p_client_id: tcid, p_role: 'teacher', p_cls: CLS, p_grp: cur, p_subgrp: sub,
        p_scores: starScores, p_form: '', p_anonymous: false, p_name: '',
        p_comment: $('#cm').value, p_password: $('#pw').value,
        p_tiers: tiers,
      });
      $('#subStd').disabled = false;
      $('#tmsg').textContent = j.ok
        ? '教师评分已提交：' + cfg.name + ' 第' + cur + '大组·第' + sub + '小组' + (tiers ? '（含个人档位）' : '（未选档位，两人同分）')
        : (j.msg || j.message || '提交失败');
      if (j.ok) showToast('教师评分已提交');
    };
  } else {
    // 4班：两张表
    box.innerHTML = '';
    lecScores = Array(cfg.lectureItems.length).fill(0);
    desScores = Array(cfg.designItems.length).fill(0);
    let html = '<div class="fblock"><h3>主讲人讲课教师评分表</h3>';
    cfg.lectureItems.forEach((it, i) => {
      html += '<div class="formrow"><span class="fname"><span class="no">' + (i + 1) + '</span>' + it[0] + '（' + it[1] + '分）</span>' +
        '<div class="slider-row">' +
        '<button class="stepbtn minus" data-kind="lec" data-idx="' + i + '">−</button>' +
        '<input type="range" class="slider" min="0" max="' + it[1] + '" step="1" value="0" data-kind="lec" data-idx="' + i + '">' +
        '<button class="stepbtn plus" data-kind="lec" data-idx="' + i + '">＋</button>' +
        '<span class="sval" id="sv-lec-' + i + '">0</span><span class="smax">/' + it[1] + '</span></div></div>';
    });
    html += '<div class="ftotal">讲课合计：<b id="lecTotal">0</b> / 100</div>';
    html += '<button class="btn primary" id="subLec" style="margin-top:12px">提交讲课评分</button></div>';

    html += '<div class="fblock"><h3>教学设计（教案+PPT）教师评分表</h3>';
    cfg.designItems.forEach((it, i) => {
      html += '<div class="formrow"><span class="fname"><span class="no">' + (i + 1) + '</span>' + it[0] + '（' + it[1] + '分）</span>' +
        '<div class="slider-row">' +
        '<button class="stepbtn minus" data-kind="des" data-idx="' + i + '">−</button>' +
        '<input type="range" class="slider" min="0" max="' + it[1] + '" step="1" value="0" data-kind="des" data-idx="' + i + '">' +
        '<button class="stepbtn plus" data-kind="des" data-idx="' + i + '">＋</button>' +
        '<span class="sval" id="sv-des-' + i + '">0</span><span class="smax">/' + it[1] + '</span></div></div>';
    });
    html += '<div class="ftotal">设计合计：<b id="desTotal">0</b> / 100</div>';
    html += '<textarea id="cm2" placeholder="评语"></textarea>';
    html += '<button class="btn primary" id="subDes" style="margin-top:12px">提交教学设计评分</button></div>';
    box.innerHTML = html;

    const updTotals = () => {
      $('#lecTotal').textContent = lecScores.reduce((a, b) => a + b, 0);
      $('#desTotal').textContent = desScores.reduce((a, b) => a + b, 0);
    };
    box.querySelectorAll('.slider').forEach(sl => {
      const kind = sl.dataset.kind, idx = +sl.dataset.idx;
      const arr = kind === 'lec' ? lecScores : desScores;
      const max = +sl.max;
      const paint = () => { $('#sv-' + kind + '-' + idx).textContent = arr[idx]; sl.value = arr[idx]; };
      sl.oninput = () => { arr[idx] = Math.min(max, Math.max(0, parseInt(sl.value, 10) || 0)); paint(); updTotals(); };
      sl.parentElement.querySelector('.minus').onclick = () => { arr[idx] = Math.max(0, arr[idx] - 1); paint(); updTotals(); };
      sl.parentElement.querySelector('.plus').onclick = () => { arr[idx] = Math.min(max, arr[idx] + 1); paint(); updTotals(); };
    });
    $('#subLec').onclick = async () => {
      if (lecScores.some(s => !s) || lecScores.some(s => s < 0)) { $('#tmsg').textContent = '请完成讲课表全部 4 项'; return; }
      $('#subLec').disabled = true;
      const j = await rpc('submit_vote', {
        p_client_id: tcid, p_role: 'teacher', p_cls: CLS, p_grp: cur, p_subgrp: sub,
        p_scores: lecScores, p_form: 'lecture', p_anonymous: false, p_name: '',
        p_comment: '', p_password: $('#pw').value,
      });
      $('#subLec').disabled = false;
      $('#tmsg').textContent = j.ok ? '讲课评分已提交：' + cfg.name + ' 第' + cur + '大组·第' + sub + '小组' : (j.msg || j.message || '提交失败');
      if (j.ok) showToast('讲课评分已提交');
    };
    $('#subDes').onclick = async () => {
      if (desScores.some(s => !s) || desScores.some(s => s < 0)) { $('#tmsg').textContent = '请完成教学设计表全部 4 项'; return; }
      $('#subDes').disabled = true;
      const j = await rpc('submit_vote', {
        p_client_id: tcid, p_role: 'teacher', p_cls: CLS, p_grp: cur, p_subgrp: sub,
        p_scores: desScores, p_form: 'design', p_anonymous: false, p_name: '',
        p_comment: $('#cm2').value, p_password: $('#pw').value,
      });
      $('#subDes').disabled = false;
      $('#tmsg').textContent = j.ok ? '教学设计评分已提交：' + cfg.name + ' 第' + cur + '大组·第' + sub + '小组' : (j.msg || j.message || '提交失败');
      if (j.ok) showToast('教学设计评分已提交');
    };
  }
}
function renderAll() { renderClsTabs(); cur = 1; sub = 1; renderGroups(); resetForms(); }
async function buildReport() {
  const cfg = curCfg();
  const rows = calcStats(await loadVotes(), CLS);
  $('#rptTitle').textContent = cfg.name + ' · 成绩单';
  let n = 0;
  const doneLines = [], undLines = [];
  rows.forEach(r => {
    if (r.final == null) {
      if (r.sv || r.tv || r.tLCount || r.tDCount) {
        undLines.push('<div class="rline">第' + r.g + '大组·第' + r.s + '小组 —— 部分评分未完成，暂无法出分</div>');
      }
      return;
    }
    n++;
    const line = cfg.mode === 'standard'
      ? '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 <b>' + r.student_pct + '</b> · 教师分 <b>' + r.teacher_pct + '</b> · 加权总分 <b>' + r.final + '</b>（第' + n + '名）'
      : '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 <b>' + r.student_pct + '</b> · 教师讲课 <b>' + r.tL + '</b> · 教学设计 <b>' + r.tD + '</b> · 最终得分 <b>' + r.final + '</b>（第' + n + '名）';
    doneLines.push('<div class="rline">' + line + '</div>');
  });
  $('#reportBody').innerHTML = doneLines.join('') + undLines.join('');
  $('#reportDate').textContent = '统计时间：' + fmtTime(new Date().toISOString());
  $('#report').style.display = 'block';
  $('#copyBtn').style.display = $('#printBtn').style.display = $('#csvBtn').style.display = 'inline-block';
  $('#report').scrollIntoView({ behavior: 'smooth' });
}
async function reportText() {
  const cfg = curCfg();
  const rows = calcStats(await loadVotes(), CLS);
  const lines = [cfg.name + ' · 成绩单', ''];
  let n = 0;
  rows.forEach(r => {
    if (r.final == null) return;
    n++;
    lines.push(cfg.mode === 'standard'
      ? '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 ' + r.student_pct + ' · 教师分 ' + r.teacher_pct + ' · 加权总分 ' + r.final + '（第' + n + '名）'
      : '第' + r.g + '大组·第' + r.s + '小组 —— 学生均分 ' + r.student_pct + ' · 教师讲课 ' + r.tL + ' · 教学设计 ' + r.tD + ' · 最终得分 ' + r.final + '（第' + n + '名）');
  });
  lines.push('', '统计时间：' + fmtTime(new Date().toISOString()));
  return lines.join('\n');
}
async function exportReportCsv() {
  const cfg = curCfg();
  const rows = calcStats(await loadVotes(), CLS);
  const head = cfg.mode === 'standard'
    ? ['大组', '小组', '学生均分', '教师分', '加权总分', '排名']
    : ['大组', '小组', '学生均分', '教师讲课', '教学设计', '最终得分', '排名'];
  const lines = [head.join(',')];
  let n = 0;
  rows.forEach(r => {
    if (r.final == null) return;
    n++;
    const row = cfg.mode === 'standard'
      ? [r.g, r.s, r.student_pct, r.teacher_pct, r.final, n]
      : [r.g, r.s, r.student_pct, r.tL, r.tD, r.final, n];
    lines.push(row.join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cfg.name + '成绩单.csv';
  a.click();
}
async function init() {
  if (sessionStorage.getItem('role') === 'teacher') { $('#login').style.display = 'none'; $('#dash').style.display = 'block'; renderAll(); }
  $('#go').onclick = async () => {
    const j = await enter($('#pw').value);
    if (!j.ok || j.role !== 'teacher') { $('#msg').textContent = j.ok ? '该密钥不是教师口令' : (j.msg || '验证失败'); return; }
    sessionStorage.setItem('role', 'teacher');
    $('#login').style.display = 'none'; $('#dash').style.display = 'block';
    renderAll();
  };
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
  $('#chpw').onclick = async () => {
    const o = $('#oldpw').value, n1 = $('#newpw1').value, n2 = $('#newpw2').value;
    if (!o || !n1) { $('#pwmsg').textContent = '请填写完整'; return; }
    if (n1 !== n2) { $('#pwmsg').textContent = '两次输入的新口令不一致'; return; }
    const j = await rpc('change_teacher_password', { p_old: o, p_new: n1 });
    $('#pwmsg').textContent = j.ok ? '' : (j.msg || '更新失败');
    if (j.ok) { $('#pw').value = n1; $('#oldpw').value = $('#newpw1').value = $('#newpw2').value = ''; showToast('教师口令已更新'); }
  };
  $('#reportBtn').onclick = buildReport;
  $('#copyBtn').onclick = async () => { await navigator.clipboard.writeText(await reportText()); alert('成绩单已复制'); };
  $('#printBtn').onclick = () => { buildReport().then(() => { document.body.classList.add('printing'); setTimeout(() => { window.print(); document.body.classList.remove('printing'); }, 100); }); };
  $('#csvBtn').onclick = exportReportCsv;
}
init();
</script>
</body>
</html>
