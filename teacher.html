<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师打分 · 课标讲解评分</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="head">
      <span class="seal">师</span>
      <h1>小组讲解评分 <span class="badge">教师票 · 权重30%</span></h1>
      <div class="sub">教师分与全班学生均分按 70 : 30 合成该组最终成绩</div>
    </div>

    <input type="password" id="password" placeholder="教师口令" style="text-align:center;letter-spacing:4px">

    <div class="groups" id="groups"></div>
    <div id="items"></div>

    <div class="row">
      <input type="checkbox" id="anon" style="width:22px;height:22px;margin:0">
      <label for="anon" style="cursor:pointer">匿名点评（分数仍计入教师分）</label>
    </div>
    <textarea id="comment" placeholder="评语（可选）：给这个小组的建议"></textarea>

    <button class="btn primary" id="submit" style="margin-top:20px">提交教师评分</button>
    <div id="msg"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const CFG = window.APP_CONFIG;
let cur = 1, scores = [];
const tcid = localStorage.getItem('tcid') || (() => { const v = (crypto.randomUUID && crypto.randomUUID()) || Math.random().toString(36).slice(2); localStorage.setItem('tcid', v); return v; })();

async function rpc(fn, body) {
  const r = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: CFG.SUPABASE_ANON_KEY,
      Authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(body),
  });
  return r.json();
}
function paint(starsEl, val) {
  starsEl.querySelectorAll('span').forEach((s, i) => s.classList.toggle('on', i < val));
}
function renderGroups() {
  const box = $('#groups');
  box.innerHTML = '';
  for (let g = 1; g <= CFG.GROUP_COUNT; g++) {
    const b = document.createElement('button');
    b.className = 'gchip' + (g === cur ? ' on' : '');
    b.textContent = '第' + g + '组';
    b.onclick = () => { cur = g; renderGroups(); resetScores(); };
    box.appendChild(b);
  }
}
function resetScores() {
  scores = Array(CFG.ITEMS.length).fill(0);
  $('#items').querySelectorAll('.item').forEach((el, i) => paint(el.querySelector('.stars'), 0));
  $('#msg').textContent = '';
}
function renderItems() {
  const box = $('#items');
  box.innerHTML = '';
  CFG.ITEMS.forEach((it, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML =
      '<div class="ihead"><div><div class="iname"><span class="no">' + (i + 1) + '</span>' + it[0] + '</div>' +
      '<div class="ihint">' + it[1] + '</div></div>' +
      '<div class="stars">' + '<span>★</span>'.repeat(5) + '</div></div>';
    box.appendChild(div);
    const starsEl = div.querySelector('.stars');
    starsEl.querySelectorAll('span').forEach((s, k) => {
      s.onclick = () => { scores[i] = k + 1; paint(starsEl, scores[i]); };
    });
  });
  resetScores();
}
async function init() {
  renderGroups(); renderItems();
  $('#submit').onclick = async () => {
    if (!$('#password').value) { $('#msg').textContent = '请输入教师口令'; return; }
    if (scores.some(s => !s)) { $('#msg').textContent = '还有项目没打分，请完成全部十项'; return; }
    const j = await rpc('submit_vote', {
      p_client_id: tcid, p_role: 'teacher', p_grp: cur, p_scores: scores,
      p_anonymous: $('#anon').checked, p_name: '', p_comment: $('#comment').value,
      p_password: $('#password').value,
    });
    $('#msg').textContent = j.ok ? j.msg + '（同组可修改后重投）' : (j.msg || j.message || '提交失败，请检查网络');
    if (j.ok) { resetScores(); $('#comment').value = ''; }
  };
}
init();
</script>
</body>
</html>
